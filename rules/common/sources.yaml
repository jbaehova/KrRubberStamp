- rule_id: COMMON_FLOOR_WON
  description: 원 미만 절사 유틸. 개별 엔진은 법규에 따라 별도 호출
  source: "국고금 관리법 제47조 및 개별 도메인 sources.yaml에 적시한 원 미만 계산 규칙"
  effective_period: 2025-2026
  verified: false
  verification_note: "함수의 수학적 동작은 검증했으나 모든 계산 단계에 공통 적용하는 법규는 아님"
- rule_id: COMMON_TRUNCATE_TEN
  description: 양수와 음수 금액의 10원 미만을 0 방향으로 절사
  source: "국고금 관리법 제47조 및 지방회계법 제55조. 엔진별 적용 단계는 별도 출처 참조"
  effective_period: 2025-2026
  verified: false
  verification_note: "중간 세액과 징수 또는 환급 단수처리를 혼동하지 않도록 적용 단계가 필요함"
- rule_id: COMMON_TEXT_NORMALIZATION
  description: 정답 문자열 NFKC와 공백 제거 및 casefold 비교
  source: "Unicode UAX 15 https://www.unicode.org/reports/tr15/ 및 DATA_SPEC.md 채점 규약"
  effective_period: not-applicable
  verified: false
  verification_note: "벤치마크 채점 규약. 공식 세무 계산 예시 대상이 아님"
