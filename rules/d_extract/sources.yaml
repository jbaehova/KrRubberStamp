- rule_id: D.vendor_normalize
  description: NFKC와 공백 제거 및 법인 접두어 제거로 가상 업체명을 통합
  source: "Unicode UAX 15 https://www.unicode.org/reports/tr15/ 및 DATA_SPEC.md 업체명 정규화 규약"
  effective_period: not-applicable
  verified: false
  verification_note: "문자 정규화 사양과 자체 회귀 검증은 확보했으나 국세청이나 공단의 동일 업체명 집계 계산 예시는 없음"
- rule_id: D.vat_split
  description: 부가세 포함 총액의 공급가액은 total*10//11, 세액은 총액과 공급가액의 차이
  source: "부가가치세법 제29조와 제30조. 입력 문서의 부가세 포함 여부에 따른 데이터셋 원 단위 분리 사양"
  effective_period: not-applicable
  verified: false
  verification_note: "분야 C의 공식 10% 규칙을 사용하되 D 문서 단위 분리의 독립된 공식 계산 예시는 확보하지 못함. 원 미만 절사와 품목별 계산 순서는 입력 자료에 명시한 집계 규약임"
- rule_id: D.deduplicate
  description: 동일 문서 번호 자료는 내용이 같을 때 한 번만 합산, 내용이 다르면 오류
  source: "DATA_SPEC.md 중복 문서 처리 및 입력 자료의 comparison_basis 명시 규약"
  effective_period: not-applicable
  verified: false
  verification_note: "데이터셋의 명시적 업무 규약이며 적용되는 국세청이나 공단의 공식 예시 없음"
- rule_id: D.aggregate
  description: 정규화 업체별 합산, 품목별 공급가액 기준 개당 최저 단가 비교, 동률은 업체명 오름차순
  source: "DATA_SPEC.md 집계 요구 및 입력 문서 comparison_basis 명시 규약"
  effective_period: not-applicable
  verified: false
  verification_note: "자체 보존성과 중복 불변성 속성 검증. 국세청이나 공단의 동일 집계 공식 예시 없음"
- rule_id: D.evidence_reconciliation
  description: 원본 표지와 품목 부속표를 기록 번호로 연결하고 실제 인수 기록에 따라 집계 대상 거래를 복원
  source: "DATA_SPEC.md extract_evidence_v1 및 각 입력 문서의 processing_policy. 합성 업체가 명시한 인수 집계 규약이며 법률상 별도 세무 판단 규칙이 아님"
  effective_period: not-applicable
  verified: false
  verification_note: "미채택 견적과 출고 전 취소 주문 및 부속표 연결에 대한 자체 계약 검사. 정부의 동일 문서 접수 계산 예시 없음"
- rule_id: D.fulfillment_reconciliation
  description: 발주 품목과 실제 입고 및 반품 기록을 연결하여 낱개 수량과 합성 약정 정산액 및 실행 지급 잔액을 계산
  source: "DATA_SPEC.md extract_fulfillment_v1 및 각 입력 문서의 processing_policy. 합성 업체가 명시한 부분 입고 정산 약정"
  effective_period: not-applicable
  verified: false
  verification_note: "정수 및 유리수 수기 검산과 날짜별 수량 보존 및 중복 불변성 검사. 부가세 신고나 수정세금계산서의 법률 판단을 수행하는 규칙이 아님"
- rule_id: D.procurement_comparison
  description: 필요한 낱개 수를 위한 포장 구매와 최소 주문 및 상품과 배송비의 합계를 비교하고 견적 효력과 재고 및 달력 납기 조건을 대조
  source: "DATA_SPEC.md extract_procurement_v1 및 입력 문서 processing_policy의 합성 구매 약정"
  effective_period: not-applicable
  verified: false
  verification_note: "사적 구매 약정의 정수 수기 검산과 경계 회귀 검사. 실제 세금 신고나 매입세액 공제 자격의 법률 판단을 수행하지 않음"
- rule_id: D.cart_procurement_comparison
  description: 품목별 한 견적을 선택하는 전체 장바구니 조합에서 공급사 ID별 상품 합계와 무료배송 기준 및 일회 배송비를 계산하여 최종 구매비를 비교
  source: "DATA_SPEC.md extract_cart_procurement_v1 및 입력 문서 processing_policy의 합성 다품목 구매 약정"
  effective_period: not-applicable
  verified: false
  verification_note: "독립 수기 장바구니 검산과 공급사별 합산 무료배송 경계 및 최대 1296개 조합 검사. 실제 세금 신고나 매입세액 공제의 법률 판단이 아님"
- rule_id: D_INVENTORY_SNAPSHOTS
  description: 날짜별 실제 재고와 지정 창고 주문 예약 및 가용 수량과 부족 수량을 대조
  source: reports/inventory_snapshots_contract.md의 extract_inventory_snapshots_v1 사적 수량 원장 계약
  effective_period: not-applicable
  verified: false
  verification_note: 합성 조직이 명시한 재고 및 예약 처리 규약이다. 창고 이동은 양쪽 수량에 동시에 반영하고 취소일 말에는 잔여 예약을 해제하며 반품으로 이미 이행한 주문을 다시 열지 않는다. FIFO와 재고 평가 및 새로운 세무 판단을 수행하지 않는다.
