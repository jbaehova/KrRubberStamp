schema_version: 1
verified_definition: 공식 출처의 적용 시점 확인과 독립된 공식 수치 예시 회귀 검증을 모두 확보. 정부 계산 대상이 아닌 규약은
  false.
rules:
- rule_id: A_CARD
  description: 총급여 25% 문턱, 15/30/40% 공제율, 기본 300/250만원과 통합 추가 300/200만원 한도
  source: 조세특례제한법 제126조의2의 2025년 귀속 규정; 국세청 2025 개정 안내 https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7794&mi=2466
    ; 2025년 신고서 작성방법 https://law.go.kr/LSW/flDownload.do?bylClsCd=110202&flSeq=153744873&gubun=;
    2025 국세청 신고안내 https://webtv.nts.go.kr/comm/nttFileDownload.do?fileKey=88c482e8d69eb1653515871654a4ab42
  effective_period: 2025-01-01/2025-12-31; 체육시설 사용분은 2025-07-01 이후
  verified: true
  verification_note: p216 총급여6540만원, 카드사용3100만원, 공제4895000원. 공식 종합사례 회귀검증. 개별 규칙의
    모든 조합을 공식 사례로 검증한 것은 아님.
- rule_id: A_CHILD
  description: 기본공제 자녀 및 손자녀 중 8세 이상 1명 25만원, 2명 55만원, 이후 40만원 추가. 출생 입양 첫째 30만원 둘째
    50만원 이후 70만원. 순위는 사망 자녀를 포함한 가족의 누적 출생 및 입양 신고 순서이며 매년 초기화하지 않음
  source: 소득세법 제59조의2; 국세청 https://j.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7875&mi=6439
    ; 2025 적용 개정내용 https://taxlaw.nts.go.kr/st/USESTA004P.do?ntstBrkdId=100000000000280411&ntstBscId=100000000000001565&ntstSysClCd=01&ntstTextUqno=0059025
  effective_period: 2025-01-01/2025-12-31
  verified: true
- rule_id: A_DONATION_CREDIT
  description: 특례 100%, 일반 30%, 종교 혼합 한도와 1000만원까지 15% 초과 30% 기부금 세액공제
  source: 소득세법 제59조의4 제4항; 국세청 특별세액공제 https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7874&mi=6594;
    2025 국세청 신고안내 https://webtv.nts.go.kr/comm/nttFileDownload.do?fileKey=88c482e8d69eb1653515871654a4ab42
  effective_period: 2025-01-01/2025-12-31
  verified: true
  verification_note: p219 특례기부50만원, 공제75000원. 공식 종합사례 회귀검증. 개별 규칙의 모든 조합을 공식 사례로 검증한
    것은 아님.
- rule_id: A_EDUCATION_CREDIT
  description: 교육비 15%, 본인 전액, 가족 학교 300만원과 대학 900만원 한도, 가족 대학원 제외, 장학금 차감. 동일 학생의
    적격 장애인 특수교육비는 일반 학교 및 대학 한도와 분리
  source: 소득세법 제59조의4 제3항; 국세청 특별세액공제 https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7874&mi=6594;
    2025 국세청 신고안내 https://webtv.nts.go.kr/comm/nttFileDownload.do?fileKey=88c482e8d69eb1653515871654a4ab42
  effective_period: 2025-01-01/2025-12-31
  verified: true
  verification_note: p218 취학전120만원과고등학생300만원, 공제630000원. 공식 종합사례 회귀검증. 개별 규칙의 모든 조합을
    공식 사례로 검증한 것은 아님.
- rule_id: A_EMPLOYMENT_CREDIT
  description: 산출세액 130만원 기준 55/30% 근로소득세액공제와 총급여별 74~20만원 한도
  source: 소득세법 제59조; 국세청 세액공제 안내 https://j.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7875&mi=6439;
    2025 국세청 신고안내 https://webtv.nts.go.kr/comm/nttFileDownload.do?fileKey=88c482e8d69eb1653515871654a4ab42
  effective_period: 2025-01-01/2025-12-31
  verified: true
  verification_note: p162 공식 사례495000원과660000원 및 p217 종합사례. 공식 종합사례 회귀검증. 개별 규칙의 모든
    조합을 공식 사례로 검증한 것은 아님.
- rule_id: A_EVIDENCE_RECONCILIATION
  description: 계약과 주민등록 주소 대조, 진료 목적과 카드 청구 명목 및 취학기관 종류, 연말 세대원 주택 목록과 기부단체 지정기간
    연결에서 한정된 엔진 사실 복원
  source: 2025 국세청 원천징수의무자 신고안내(월세 주소 요건, 관리비 및 미용 비용 제외, 취학 학원비, 세대원2주택) https://webtv.nts.go.kr/comm/nttFileDownload.do?fileKey=88c482e8d69eb1653515871654a4ab42;
    특별세액공제 안내 https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7874&mi=6594;
    가상 원자료 연결 계약 DATA_SPEC.md
  effective_period: 2025-01-01/2025-12-31
  verified: false
  verification_note: 기초 법률 요건 확인. 합성 원자료 연결 자체의 독립 공식 수치 예시는 없음. 자유문장 법률 판단이나 주택 취득
    및 차입의 전 요건 검증을 지원하지 않는다.
- rule_id: A_FINAL
  description: 산출세액에서 세액공제 차감. 결정세액 음수 배제. 원 미만 절사
  source: 소득세법 제137조; 2025 국세청 신고안내 p219 https://webtv.nts.go.kr/comm/nttFileDownload.do?fileKey=88c482e8d69eb1653515871654a4ab42
  effective_period: 2025-01-01/2025-12-31
  verified: true
  verification_note: p219 산출4182750원, 결정240232원. 공식 종합사례 회귀검증. 개별 규칙의 모든 조합을 공식 사례로
    검증한 것은 아님.
- rule_id: A_HOMETOWN_CREDIT
  description: 본인 일반 고향사랑 기부금 연2000만원 한도. 10만원까지100/110, 초과15%.
  source: 2025 국세청 원천징수의무자 신고안내 https://webtv.nts.go.kr/comm/nttFileDownload.do?fileKey=88c482e8d69eb1653515871654a4ab42
  effective_period: 2025-01-01/2025-12-31
  verified: true
  verification_note: p219 고향사랑10만원의 공제90909원. 특별재난지역30%는 생성범위 밖.
- rule_id: A_HOUSING
  description: 2025 장기주택저당차입금 이자공제. 적격 증빙 확인된2012년 이후 차입의 기간과 상환방식별600/800/1800/2000만원
    한도. 연말 세대 주택 수가0또는1인 전제에서 근무 기간 중 실제 납부한 이자만 적용하며 카드와 합계2500만원 종합한도.
  source: 2025 국세청 원천징수의무자 신고안내 https://webtv.nts.go.kr/comm/nttFileDownload.do?fileKey=88c482e8d69eb1653515871654a4ab42
  effective_period: 2025-01-01/2025-12-31
  verified: true
  verification_note: p115 한도표 및 p215 종합사례100만원. 앞부분 공제 요건표의 주택자금 근무 기간 기준을 적용. 주택
    적격 상세요건은 증빙 확인 필드로 표시. 중도 퇴직의 월별 합산은 별도 구현 회귀 검증이며 공식 수치 예시라고 주장하지 않음.
- rule_id: A_INSURANCE_CREDIT
  description: 보장성 보험료 100만원 한도 12%, 장애인전용 보장성 보험료 별도 100만원 한도 15%
  source: 소득세법 제59조의4 제1항; 국세청 특별세액공제 https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7874&mi=6594;
    2025 국세청 신고안내 https://webtv.nts.go.kr/comm/nttFileDownload.do?fileKey=88c482e8d69eb1653515871654a4ab42
  effective_period: 2025-01-01/2025-12-31
  verified: true
  verification_note: p172 보험료110만원 사례 및 p217 한도 적용120000원. 공식 종합사례 회귀검증. 개별 규칙의 모든
    조합을 공식 사례로 검증한 것은 아님.
- rule_id: A_LOCAL
  description: 소득세 결정세액 10% 지방소득세. 원 미만 절사
  source: 지방세법 제103조의13 https://law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1031061107
  effective_period: 2025-01-01/2025-12-31
  verified: false
  verification_note: 10% 법령 근거 확인. 제공 조문 현재 시행일 2026-07-01. 2025 공식 정산 숫자 예시 미확보.
- rule_id: A_MEDICAL_CREDIT
  description: 총급여 3% 초과 의료비, 일반 700만원 한도, 본인 및 6세 이하 등 무한도, 미숙아 20%, 난임 30%, 나머지
    15%, 실손 보전액 제외
  source: 소득세법 제59조의4 제2항; 국세청 특별세액공제 https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7874&mi=6594;
    2025 국세청 신고안내 https://webtv.nts.go.kr/comm/nttFileDownload.do?fileKey=88c482e8d69eb1653515871654a4ab42
  effective_period: 2025-01-01/2025-12-31
  verified: true
  verification_note: p173 혼합의료비 문턱 산식, p218 실제 공제950700원. 공식 종합사례 회귀검증. 개별 규칙의 모든
    조합을 공식 사례로 검증한 것은 아님.
- rule_id: A_PENSION_CREDIT
  description: 연금저축 600만원과 IRP 포함 총 900만원 한도, 총급여 5500만원 이하 15% 초과 12%
  source: 소득세법 제59조의3; 국세청 https://j.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7875&mi=6439;
    2025 국세청 신고안내 https://webtv.nts.go.kr/comm/nttFileDownload.do?fileKey=88c482e8d69eb1653515871654a4ab42
  effective_period: 2025-01-01/2025-12-31
  verified: true
  verification_note: p217 연금저축200만원과IRP100만원, 공제360000원. 공식 종합사례 회귀검증. 개별 규칙의 모든 조합을
    공식 사례로 검증한 것은 아님.
- rule_id: A_PENSION_DEDUCTION
  description: 근로자 본인 공적 연금보험료 실제 납부액 소득공제
  source: 소득세법 제51조의3 https://www.law.go.kr/법령/소득세법/제51조의3; 2025 국세청 신고안내 https://webtv.nts.go.kr/comm/nttFileDownload.do?fileKey=88c482e8d69eb1653515871654a4ab42
  effective_period: 2025-01-01/2025-12-31
  verified: true
  verification_note: p215 국민연금250만원. 공식 종합사례 회귀검증. 개별 규칙의 모든 조합을 공식 사례로 검증한 것은 아님.
- rule_id: A_PERSONAL
  description: 기본공제 소득 및 나이 요건, 장애인 예외, 경로우대, 부녀자, 한부모와 중복 신청 배제
  source: 소득세법 제50조 및 제51조; 국세청 법령 안내 https://taxlaw.nts.go.kr/qt/USEQTA002P.do?ntstDcmId=010000000000524810;
    2025 국세청 신고안내 https://webtv.nts.go.kr/comm/nttFileDownload.do?fileKey=88c482e8d69eb1653515871654a4ab42
  effective_period: 2025-01-01/2025-12-31
  verified: true
  verification_note: p99 장애인23세 자녀 사례 및 p215 기본공제600만원. 공식 종합사례 회귀검증. 개별 규칙의 모든 조합을
    공식 사례로 검증한 것은 아님.
- rule_id: A_POLITICAL_CREDIT
  description: 본인 정치자금 기부금. 10만원까지100/110, 3000만원까지 초과분15%, 이후25%.
  source: 2025 국세청 원천징수의무자 신고안내 https://webtv.nts.go.kr/comm/nttFileDownload.do?fileKey=88c482e8d69eb1653515871654a4ab42
  effective_period: 2025-01-01/2025-12-31
  verified: true
  verification_note: p219 정치자금20만원의 공제105909원.
- rule_id: A_RENT_CREDIT
  description: 총급여 8000만원 이하 무주택 요건, 연 1000만원 한도, 5500만원 이하 17% 초과 15%, 면적 또는 기준시가
    및 전입 요건
  source: 조세특례제한법 제95조의2; 국세청 월세액 안내 https://webtv.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=239025&mi=40613
    ; 2025 월세 해설 https://webtv.nts.go.kr/comm/nttFileDownload.do?fileKey=d68280b905b4d057a1b8ea26039cd832
  effective_period: 2025-01-01/2025-12-31
  verified: false
  verification_note: 공식 요건 확인. 공식 숫자 예시 미확보.
- rule_id: A_SALARY
  description: 총급여 비과세 제외와 근로소득공제 구간 및 2000만원 한도
  source: 소득세법 제20조 및 제47조; 국세청 근로소득금액 안내 https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7871&mi=6594
  effective_period: 2025-01-01/2025-12-31
  verified: true
- rule_id: A_SETTLEMENT
  description: 영수증 결정세액에서 기납부세액을 원 단위로 차감. 납부 양수, 환급 음수. 실제 납부 시 10원 단위 끝수 처리는 답안
    범위 밖.
  source: 소득세법 제137조; 2025 국세청 신고안내 p219 https://webtv.nts.go.kr/comm/nttFileDownload.do?fileKey=88c482e8d69eb1653515871654a4ab42
  effective_period: 2025-01-01/2025-12-31
  verified: true
  verification_note: p219 결정240232원에서기납부100만원을 뺀 환급759768원. 원 단위 영수증 정산. 공식 종합사례 회귀검증.
    개별 규칙의 모든 조합을 공식 사례로 검증한 것은 아님.
- rule_id: A_SPECIAL_DEDUCTION
  description: 본인 부담 건강보험, 장기요양보험 및 고용보험료 전액 공제
  source: 소득세법 제52조; 국세청 특별소득공제 안내 https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=239033&mi=40681;
    2025 국세청 신고안내 https://webtv.nts.go.kr/comm/nttFileDownload.do?fileKey=88c482e8d69eb1653515871654a4ab42
  effective_period: 2025-01-01/2025-12-31
  verified: true
  verification_note: p215 건강보험과 장기요양 합계170만원. 공식 종합사례 회귀검증. 개별 규칙의 모든 조합을 공식 사례로 검증한
    것은 아님.
- rule_id: A_STANDARD
  description: 특별소득공제와 특별세액공제 및 월세 공제를 신청하지 않은 근로자 표준세액공제13만원. 신청했지만 인정액0인 경우와 미신청을
    구별. 정치자금과 고향사랑 및 연금계좌와 카드 공제는 중복 가능.
  source: 소득세법 제59조의4 제9항 https://www.law.go.kr/법령/소득세법/제59조의4; 2025 국세청 원천징수의무자 신고안내
    책170쪽/PDF188쪽 https://webtv.nts.go.kr/comm/nttFileDownload.do?fileKey=88c482e8d69eb1653515871654a4ab42
  effective_period: 2025-01-01/2025-12-31
  verified: false
  verification_note: 2025 공식 신청 요건과13만원 안내 확인. 독립된 정산 숫자 예시는 미확보. 공제액0을 미신청으로 자동 해석하지
    않는다.
- rule_id: A_TAX_BRACKETS
  description: 2023~2025 종합소득 과세표준 기본세율 6~45%와 누진공제
  source: 소득세법 제55조; 국세청 https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7873&mi=6437
    ; https://ems.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7667&mi=2227
  effective_period: 2023-01-01/2025-12-31
  verified: true
- rule_id: B.CHILD_CREDIT
  description: 1~2월은 자녀1명12,500원 및2명29,160원. 3~12월은1명20,830원 및2명45,830원. 세 번째 이상 추가1명당25,000원
    또는33,330원. 음수0 처리.
  source: 국세청 기존 원천징수 안내 https://b.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7862&mi=6426
    ; 소득세법 시행령 별표2 제3호(2026.2.27 개정), https://www.law.go.kr/LSW/flDownload.do?flSeq=164357181
    ; 대통령령 제36129호 부칙 제1조제3호 및 제15조 https://www.law.go.kr/LSW/lsRvsDocInfoR.do?lsiSeq=283631&chrClsCd=010202&lsRvsGubun=Doc
  effective_period: 2026-01-01~2026-02-28 기존 공제. 2026-03-01 이후 개정 공제
  verified: false
  verification_notes: 두 시점의 공제금액과 2026년3월1일 이후 원천징수 적용은 대통령령 제36129호 부칙 원문으로 확인. 다만
    신 공제액을 적용한 전체 급여의 독립 공식 수치 예시는 미확보. 국세청 일반 안내는10월 조회 당시에도 구 공제액 표시.
- rule_id: B.EMPLOYMENT
  description: 고지 월평균보수에 실업급여 근로자0.9% 적용. 시나리오 약정에 따라10원 미만 버림.
  source: 고용노동부 고용보험 안내, https://ei.work24.go.kr/ei/eih/eg/ei/eiEminsr/retrieveEi0102Info.do
    ; 고용보험 및 산업재해보상보험의 보험료징수 등에 관한 법률 제13조 및 제16조의2.
  effective_period: '2026'
  verified: false
  verification_notes: 공식0.9% 확인. 급여에서 항목별10원 버림은 명시 합성 약정으로 고지 납부액과 급여 공제액의 차이 가능성을
    범위 밖으로 둠. 공식 수치 예시 미확보.
- rule_id: B.EVIDENCE_RECONCILIATION
  description: 개별 집필 자료의 승인본과 지급 실행 기록을 대조하고 휴게시간을 제외한 근로 구간에서 실제 분수 및 야간 겹침을 계산한다.
  source: DATA_SPEC.md의 원시 근태 증빙 계약. 문항에 명시한 합성 회사의 승인본 처리 및 지급 기록 대조 규약. 세법상 별도 요율이
    아니라 입력 사실 복원 규약이며 수당의 법적 적용은 B.OVERTIME, B.NIGHT, B.HOLIDAY, B.WEEKLY를 따른다. ;
    기간제 및 단시간근로자 보호 등에 관한 법률 제6조제3항 https://law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1010787027
    ; 국민연금 취득월 납부희망 FAQ https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0097M0.do ; 국민건강보험법69조2항
    https://www.nhis.or.kr/lm/lmxsrv/law/lawFullContent.do?SEQ=27&SEQ_HISTORY=43918
  effective_period: 2026 개별 집필 자료 계약
  verified: false
  verification_notes: 합성 증빙 처리 규약이므로 대응하는 공단 공식 숫자 예시는 없다. 출퇴근 및 휴게 경계와 수정 승인, 지급
    실행 우선순위를 별도 회귀 검사한다.
- rule_id: B.GROSS
  description: 지급항목 합계와 식대 비과세 차감 후 간이세액표용 월 급여 산출.
  source: 소득세법 제20조 및 제12조. 시나리오의 합성 근로계약에 정한 지급항목 합산.
  effective_period: '2026'
  verified: false
  verification_notes: 합성 계약 기반 산술 검증. 공식 자료의 실제 급여명세서 예시와 동일한 구성은 없음.
- rule_id: B.HEALTH
  description: 고지 보수월액에 근로자3.595% 적용. 근로자 부담 하한10,080원 및 상한4,591,740원. 10원 미만 버림.
  source: 국민건강보험공단 2026 요율, https://edi.nhis.or.kr/portal/images/popup/20251204_pop01longdesc.html
    ; 보건복지부고시 제2025-222호, https://www.nhis.or.kr/lm/lmxsrv/law/lawFullContent.do?SEQ=39&SEQ_HISTORY=
    ; 국민건강보험법 제107조.
  effective_period: 2026-01-01~2026-12-31
  verified: false
  verification_notes: 공식 요율7.19%와 50% 부담 및 상하한 확인. 산술 파생 경계 테스트이며 독립 공식 납부액 예시 미확보.
- rule_id: B.HOLIDAY
  description: 법정 유급휴일 1일 8시간 이내 150% 및 초과 200% 지급. 휴일 가산과 연장 가산을 별도 중복하지 않음.
  source: 근로기준법 제56조제2항. https://1350.moel.go.kr/rtmview.do?id=1000292921 ; https://www.moel.go.kr/minwon/fastcounsel/fastcounselView.do?inetDcssMngId=202212191019175521000
    ; 관공서의 공휴일에 관한 규정 대통령령36290호(2026-04-30개정,2026-05-11시행), 제헌절 공휴일 재지정 https://www.law.go.kr/lsInfoP.do?lsiSeq=285779&viewCls=lsRvsDocInfoR
  effective_period: '2026'
  verified: false
  verification_notes: 법정 배율 확인. 독립 공식 수치 예시 미확보.
- rule_id: B.LOCAL_TAX
  description: 특별징수 소득세의10%에 지방세기본법 끝수 처리 적용. 10원 미만 버림.
  source: 지방세법 제103조의13 https://law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1031061107
    ; 지방세기본법 제55조(끝수 계산).
  effective_period: '2026'
  verified: false
  verification_notes: 법령 요율 확인. 독립 공식 월급여 계산 예시 미확보.
- rule_id: B.LONG_TERM_CARE
  description: 근로자 건강보험료에0.9448%/7.19%의 정확한 비율 적용 후10원 미만 버림. 13.14%를 중간 근사하여 적용하지
    않음.
  source: 국민건강보험공단 2026 보험료율 인상 안내, https://edi.nhis.or.kr/portal/images/popup/20251204_pop01longdesc.html
    ; 노인장기요양보험법 제9조 및 제11조.
  effective_period: 2026-01-01~2026-12-31
  verified: false
  verification_notes: 원문 정확한 산식 확인. 독립 공식 수치 예시 미확보.
- rule_id: B.MEAL_EXEMPT
  description: 식사를 별도 제공받지 않는 근로자의 식대는 월20만원까지 비과세. 비과세 여부와 통상임금 여부는 서로 별도로 적용.
  source: 소득세법 제12조제3호 러목. https://b.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7867&mi=6431
  effective_period: '2026'
  verified: false
  verification_notes: 법령 기준 확인. 엔진 입력 구성의 독립 공식 수치 예시 미확보.
- rule_id: B.NET
  description: 총지급액에서 근로자 부담 국민연금과 건강보험 및 장기요양, 고용보험, 원천징수 소득세와 지방소득세 차감.
  source: 근로기준법 제43조. 국민연금공단 사업장보험 부담 안내 https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0097M0.do
    . 합성 급여 산술 항목 합계.
  effective_period: '2026'
  verified: false
  verification_notes: 독립 공식 급여명세서 전체 수치 예시 미확보. 정산 및 체납 공제를 포함하지 않으며 공제액이 지급액을 초과한
    입력은 거부.
- rule_id: B.NIGHT
  description: 22시부터 06시까지 야간근로에 통상임금 50% 가산. 연장 또는 휴일 중복에도 추가.
  source: 근로기준법 제56조제3항. https://1350.moel.go.kr/rtmview.do?id=1000297880
  effective_period: '2026'
  verified: false
  verification_notes: 법정 배율 및 중복은 확인. 독립 공식 수치 예시 미확보.
- rule_id: B.ORDINARY
  description: 정기적 일률적인 소정근로 대가인 기본급과 직무수당 및 정액식대를 월 통상임금에 포함. 원 분수 유지 및 항목별 원 미만
    올림은 합성 계약 명시 기준.
  source: 고용노동부 개정 통상임금 노사지도 지침(2025.2.6), https://www.moel.go.kr/local/busan/news/notice/noticeView.do?bbs_seq=20250200564
    ; 근로기준법 시행령 제6조. 단수 올림은 시나리오 합성 계약.
  effective_period: '2026'
  verified: false
  verification_notes: 원문 법정 개념 확인. 이 엔진 구성과 직접 일치하는 공단 독립 수치 예시 및 합성 단수 약정의 공식 예시는
    없음.
- rule_id: B.OVERTIME
  description: 상시 5인 이상 평일 연장근로에 실제 근로 대가와 50% 가산 지급. 휴일 분을 연장 분에서 제외.
  source: 근로기준법 제56조제1항. https://1350.moel.go.kr/rtmview.do?id=1000297880 ; 기간제 및
    단시간근로자 보호 등에 관한 법률 제6조제3항 https://law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1010787027
  effective_period: '2026'
  verified: false
  verification_notes: 법정 배율은 확인. 독립 공식 계산 예시 대신 합성 경계 테스트 사용.
- rule_id: B.PAID_HOLIDAY
  description: 시급제 공휴일의 유급 임금 100%를 실제 휴일근로 대가와 별도 합산. 단시간 근로자는 4주 소정근로 시간과 통상근로자의
    4주 소정근로일 수로 비례. 정규 임금 포함분과 주휴수당 중복 금지.
  source: 근로기준법 제18조 및 제55조와 시행령 별표2. 고용노동부 https://1350.moel.go.kr/rtmview.do?id=1000323476
    ; https://www.moel.go.kr/minwon/fastcounsel/fastcounselView.do?inetDcssMngId=202108181232364201000
    . 문항의 별도 임금 포함 여부와 비교 근로일수는 입력 사실. ; 관공서의 공휴일에 관한 규정 대통령령36290호(2026-04-30개정,2026-05-11시행),
    제헌절 공휴일 재지정 https://www.law.go.kr/lsInfoP.do?lsiSeq=285779&viewCls=lsRvsDocInfoR
  effective_period: '2026'
  verified: false
  verification_notes: 공식 안내의 100%와 실제근로 150% 구분 및 비례 시간 산식 확인. 엔진과 일치하는 독립된 원 단위 공식
    수치 예시 미확보. 분수 분 단위 비례시간은 범위 밖으로 두고 거절.
- rule_id: B.PENSION
  description: 공단 통지 기준소득 신고액 천원 미만 버림. 2026 근로자4.75%. 공단 보험 부과월 1~6월 40만원~637만원,
    7~12월 41만원~659만원. 실제 급여 이체일과 구분. 보험료10원 미만 버림.
  source: 국민연금공단 2026 Q&A, https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0097M0.do
    ; 2025.7 상하한 https://www.nps.or.kr/html/download/memberGuide_2.pdf ; 2026년 7월
    조정 통지 https://www.nps.or.kr/pnsgdnc/newgdnc/getOHAE0001M1.do?pstId=ZZ202600000000000147
    ; 국민연금법 제117조 및 국고금관리법 제47조.
  effective_period: 2026-01-01~2026-12-31. 상하한 변경 2026-07-01
  verified: true
  verification_notes: 공단이 직접 제시한 기준소득월액100만원 47,500원 및200만원95,000원. 263만6천원125,210원
    및395만4천원187,810원 예시 회귀 포함.
- rule_id: B.TAX_TABLE
  description: 공식 소득세법 시행령 별표2의 월급여 구간646행과 본인포함 가족수1~11 열을 원문 그대로 조회. 월급여 정확히1000만원
    행과 초과분 공식 산식 별도 적용.
  source: 소득세법 시행령 별표2(2026.2.27 개정), https://www.law.go.kr/LSW/flDownload.do?flSeq=164357181
    ; 독립 대조용 국세청2023 XLSX https://www.nts.go.kr/nts/na/ntt/selectNttInfo.do?nttSn=1322151
  effective_period: 2026. 기본 표 수치646행은 국세청2023 XLSX와 전부 동일
  verified: true
  verification_notes: 7,106개 가족별 원문 셀을 PDF에서 추출하고 NTS XLSX 전 셀과 대조. 독립 수치 회귀용30개 셀과
    원문 파일 해시 보관.
- rule_id: B.WEEKLY
  description: 4주 평균 주 소정근로 15시간 이상이고 개근한 주의 주휴시간은 주40시간에 비례. 월급 포함분 중복 지급 금지.
  source: 근로기준법 제18조제3항 및 제55조. https://www.moel.go.kr/mainpop2.do ; https://1350.moel.go.kr/rtmview.do?id=1000278823&page=1&type=ALL
  effective_period: '2026'
  verified: false
  verification_notes: 고용노동부 20시간 사례의 산식 확인. 원 단위 결과가 기재된 독립 공식 예시는 미확보.
- rule_id: B.WITHHOLDING
  description: 표 세액에서 자녀 공제 후80% 및100% 또는120% 선택 비율 적용. 10원 미만 버림. 소득세법제86조에 따라 지급
    건별1000원 미만 부징수.
  source: 소득세법 시행령 제194조. 국세청 공식 사례20,180원 및80%16,140원/120%24,210원 https://b.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7862&mi=6426
    ; 소득세법 제86조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0086&lsiSeq=280405&urlMode=lsScJoRltInfoR
    ; 국고금관리법제47조.
  effective_period: '2026'
  verified: true
  verification_notes: 국세청 구 자녀공제2명 사례와 선택 비율3개 결과를1~2월 날짜로 회귀 검증. 개정 자녀공제 시행일의 증거
    한계는 B.CHILD_CREDIT 참조.
- rule_id: COMMON_FLOOR_WON
  description: 원 미만 절사 유틸. 개별 엔진은 법규에 따라 별도 호출
  source: 국고금 관리법 제47조 및 개별 도메인 sources.yaml에 적시한 원 미만 계산 규칙
  effective_period: 2025-2026
  verified: false
  verification_note: 함수의 수학적 동작은 검증했으나 모든 계산 단계에 공통 적용하는 법규는 아님
- rule_id: COMMON_TEXT_NORMALIZATION
  description: 정답 문자열 NFKC와 공백 제거 및 casefold 비교
  source: Unicode UAX 15 https://www.unicode.org/reports/tr15/ 및 DATA_SPEC.md 채점 규약
  effective_period: not-applicable
  verified: false
  verification_note: 벤치마크 채점 규약. 공식 세무 계산 예시 대상이 아님
- rule_id: COMMON_TRUNCATE_TEN
  description: 양수와 음수 금액의 10원 미만을 0 방향으로 절사
  source: 국고금 관리법 제47조 및 지방회계법 제55조. 엔진별 적용 단계는 별도 출처 참조
  effective_period: 2025-2026
  verified: false
  verification_note: 중간 세액과 징수 또는 환급 단수처리를 혼동하지 않도록 적용 단계가 필요함
- rule_id: D.aggregate
  description: 정규화 업체별 합산, 품목별 공급가액 기준 개당 최저 단가 비교, 동률은 업체명 오름차순
  source: DATA_SPEC.md 집계 요구 및 입력 문서 comparison_basis 명시 규약
  effective_period: not-applicable
  verified: false
  verification_note: 자체 보존성과 중복 불변성 속성 검증. 국세청이나 공단의 동일 집계 공식 예시 없음
- rule_id: D.deduplicate
  description: 동일 문서 번호 자료는 내용이 같을 때 한 번만 합산, 내용이 다르면 오류
  source: DATA_SPEC.md 중복 문서 처리 및 입력 자료의 comparison_basis 명시 규약
  effective_period: not-applicable
  verified: false
  verification_note: 데이터셋의 명시적 업무 규약이며 적용되는 국세청이나 공단의 공식 예시 없음
- rule_id: D.evidence_reconciliation
  description: 원본 표지와 품목 부속표를 기록 번호로 연결하고 실제 인수 기록에 따라 집계 대상 거래를 복원
  source: DATA_SPEC.md extract_evidence_v1 및 각 입력 문서의 processing_policy. 합성 업체가 명시한
    인수 집계 규약이며 법률상 별도 세무 판단 규칙이 아님
  effective_period: not-applicable
  verified: false
  verification_note: 미채택 견적과 출고 전 취소 주문 및 부속표 연결에 대한 자체 계약 검사. 정부의 동일 문서 접수 계산 예시
    없음
- rule_id: D.vat_split
  description: 부가세 포함 총액의 공급가액은 total*10//11, 세액은 총액과 공급가액의 차이
  source: 부가가치세법 제29조와 제30조. 입력 문서의 부가세 포함 여부에 따른 데이터셋 원 단위 분리 사양
  effective_period: not-applicable
  verified: false
  verification_note: 분야 C의 공식 10% 규칙을 사용하되 D 문서 단위 분리의 독립된 공식 계산 예시는 확보하지 못함. 원 미만
    절사와 품목별 계산 순서는 입력 자료에 명시한 집계 규약임
- rule_id: D.vendor_normalize
  description: NFKC와 공백 제거 및 법인 접두어 제거로 가상 업체명을 통합
  source: Unicode UAX 15 https://www.unicode.org/reports/tr15/ 및 DATA_SPEC.md 업체명
    정규화 규약
  effective_period: not-applicable
  verified: false
  verification_note: 문자 정규화 사양과 자체 회귀 검증은 확보했으나 국세청이나 공단의 동일 업체명 집계 계산 예시는 없음
- rule_id: VAT_ACTIVITY_EVIDENCE
  description: 개별 집필 활동 기록의 실제 참여자와 장소 및 증빙번호를 연결해 엔진용 매입 사실을 복원
  source: DATA_SPEC.md의 개별 집필 사실 복원 계약 및 reports/vat_evidence_contract.md의 vat_activity_evidence_v1
    계약
  effective_period: 2026-01-01/2026-06-30
  verified: false
  verification_note: 업무 데이터 계약이다. 정부가 발표한 법규나 공식 숫자 사례로 주장하지 않는다. 공제 법규는 기존 VAT_HOSPITALITY,
    VAT_NONBUSINESS, VAT_PASSENGER_CAR, VAT_EXEMPT_LAND 및 VAT_INPUT_EVIDENCE가 처리한다.
    원자료의 모호한 활동과 상충하는 연결은 거절한다.
- rule_id: VAT_ASSESSMENT_VALIDITY
  description: 예정고지액의 최소 50만원과 천원 미만 절사 및 예정신고와 고지 결정의 중복을 검사
  source: 부가가치세법 제48조제3항 및 제4항과 제49조제1항 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0048&lsiSeq=276117&urlMode=lsScJoRltInfoR;
    https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0049&lsiSeq=276117&urlMode=lsScJoRltInfoR
  effective_period: 2026-01-01/2026-06-30
  verified: false
  legal_verified: true
  verification_note: 조문상의 징수 제외와 예정신고 시 고지 결정 취소 및 이미 신고한 거래 제외를 확인했다. 독립 공식 수치 사례는
    확보하지 못했다. 이전 신고 목록을 제외한 현재 추가 정산에서 이전 신고 납부액을 다시 빼지 않는다.
- rule_id: VAT_CREDIT_ANNUAL_LIMIT
  description: 2026년 신용카드 등 발행세액공제 연간 한도 1000만원에서 이미 공제한 금액을 차감
  source: 부가가치세법 제46조제1항제3호 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0046&lsiSeq=276117&urlMode=lsScJoRltInfoR
  effective_period: 2026-01-01/2026-06-30
  verified: false
  legal_verified: true
  verification_note: 법령상 금액과 적용기한 확인. 공식 한도 도달 계산 사례는 확보하지 못해 법식 유도 테스트. 입력에 명시한 올해
    기공제액을 남은 한도 계산에 사용
- rule_id: VAT_CREDIT_ELIGIBILITY
  description: 소비자 상대 사업 개인사업자에 한해 적용하며 법인 및 전년도 사업장별 공급가액 10억원 초과 개인사업자는 제외
  source: 부가가치세법 제46조제1항 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0046&lsiSeq=276117&urlMode=lsScJoRltInfoR;
    국세청 세무 안내 https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=239004&mi=40574
  effective_period: 2026-01-01/2026-06-30
  verified: false
  legal_verified: true
  verification_note: 대상 제한은 공식 안내로 확인. 정확히 10억원과 10억원 초과 및 법인 제외 숫자 경계는 법식 유도 테스트이며
    독립 공식 금액 계산 사례 없음
- rule_id: VAT_CREDIT_PAYABLE_LIMIT
  description: 발행세액공제는 차감 전 양수 납부세액을 한도로 하며 초과액으로 환급을 만들지 않음
  source: 부가가치세법 제46조제2항 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0046&lsiSeq=276117&urlMode=lsScJoRltInfoR;
    국세청 도소매업 신고서 PDF 3쪽 https://www.nts.go.kr/comm/nttFileDownload.do?fileKey=95e20f2fcbd5b8094e3899abd6609bc2
  effective_period: 2026-01-01/2026-06-30
  verified: false
  legal_verified: true
  verification_note: 법령상의 발행 공제 자체로 환급을 만들 수 없는 제한 확인. 공제를 제한한 뒤 예정고지를 차감하며 예정고지 초과
    납부로 환급 가능. 공식 한도 초과 수치 사례 미확보
- rule_id: VAT_CREDIT_RATE_2026
  description: 2026년 12월 31일까지 신용카드와 현금영수증 발행금액의 1.3% 공제
  source: 부가가치세법 제46조제1항제3호 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0046&lsiSeq=276117&urlMode=lsScJoRltInfoR;
    국세청 도소매업 신고서 PDF 3쪽 https://www.nts.go.kr/comm/nttFileDownload.do?fileKey=95e20f2fcbd5b8094e3899abd6609bc2
  effective_period: 2026-01-01/2026-06-30
  verified: true
  verification_note: 법령에서 우대율 적용기한 확인. 공식 도소매업 1540만원 * 1.3% = 200200원 회귀 검증. 원 미만
    공제액은 버리는 입력 계약으로 계산하며 공식 사례 외 끝수 경계는 자체 검사
- rule_id: VAT_DEDUP
  description: 실제 거래 고유번호가 같은 증빙은 공급가액과 세액을 한 번만 집계
  source: 국세청 2024년 제2기 확정 도소매업 신고서 작성사례 PDF 2~3쪽 https://www.nts.go.kr/comm/nttFileDownload.do?fileKey=95e20f2fcbd5b8094e3899abd6609bc2
  effective_period: 2026-01-01/2026-06-30
  verified: true
  verification_note: 세금계산서와 신용카드 중복 공급가액 1000만원이 기재되고 중복 제외 과세표준 1억500만원이 신고서에 계산됨.
    transaction_id와 모순 증빙 거절은 데이터셋 업무 규약
- rule_id: VAT_EXEMPT_LAND
  description: 면세사업에 직접 사용한 매입 및 토지 관련 매입세액 불공제
  source: 부가가치세법 제39조제1항제7호 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0039&lsiSeq=276117&urlMode=lsScJoRltInfoR
  effective_period: 2026-01-01/2026-06-30
  verified: false
  legal_verified: true
  verification_note: 면세사업 직접 귀속과 토지 자체의 조성 지출만 구현. 개별 집필 문항에 포함 가능하나 독립 공식 숫자 사례는
    미확보. 과면세 공통매입 안분은 구현 및 평가 범위에서 제외
- rule_id: VAT_HOSPITALITY
  description: 기업업무추진비인 거래처 접대 지출에 관련된 매입세액 불공제
  source: 부가가치세법 제39조제1항제6호 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0039&lsiSeq=276117&urlMode=lsScJoRltInfoR;
    국세청 매입세액 안내 https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7802&mi=2480
  effective_period: 2026-01-01/2026-06-30
  verified: false
  legal_verified: true
  verification_note: 법령상 불공제 확인. 공식 독립 숫자 사례 미확보. 가상 접대비 테스트를 공식 예시로 주장하지 않음
- rule_id: VAT_INPUT_EVIDENCE
  description: 사업 관련 적격 세금계산서와 세액이 구분된 신용카드 및 현금영수증의 매입세액을 공제
  source: 부가가치세법 제38조 및 제46조제3항 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0046&lsiSeq=276117&urlMode=lsScJoRltInfoR;
    국세청 도소매업 신고서 작성사례 PDF 2~3쪽 https://www.nts.go.kr/comm/nttFileDownload.do?fileKey=95e20f2fcbd5b8094e3899abd6609bc2
  effective_period: 2026-01-01/2026-06-30
  verified: true
  verification_note: 공식 사례의 사업용 카드와 개인용 카드로 결제한 사업 광고비 모두 공제. 공급자는 일반과세자이며 수령명세서를
    제출하고 증빙을 보관하는 사실을 입력에 명시
- rule_id: VAT_NONBUSINESS
  description: 사업과 직접 관련 없는 지출 및 대표 개인 가사 지출의 매입세액 불공제
  source: 부가가치세법 제39조제1항제4호 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0039&lsiSeq=276117&urlMode=lsScJoRltInfoR;
    국세청 사업용 신용카드 안내 https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7799&mi=6583
  effective_period: 2026-01-01/2026-06-30
  verified: false
  legal_verified: true
  verification_note: 공식 법령과 불공제 분류는 확인. 독립된 공식 금액 계산 사례는 확보하지 못해 법식 유도 테스트만 존재
- rule_id: VAT_OUTPUT_10
  description: 국내 과세 재화와 용역의 공급가액에 부가가치세 10% 적용
  source: 부가가치세법 제30조 및 국세청 세무 안내 https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=239004&mi=40574
  effective_period: 2026-01-01/2026-06-30
  verified: true
  verification_note: 국세청 도소매업과 화물운수업 공식 표 항목 및 완성 신고서 회귀 검증
- rule_id: VAT_PASSENGER_CAR
  description: 소매업의 개별소비세 과세대상 승용자동차 구입과 임차 및 유지 매입세액 불공제
  source: 부가가치세법 제39조제1항제5호 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0039&lsiSeq=276117&urlMode=lsScJoRltInfoR;
    국세청 매입세액 안내 https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7802&mi=2480
  effective_period: 2026-01-01/2026-06-30
  verified: false
  legal_verified: true
  verification_note: 직접 영업용 제외 문구를 포함한 법령 확인. 공식 독립 승용차 불공제 금액 사례 미확보. 화물트럭 공제는 공식
    도소매업 사례로 별도 검증
- rule_id: VAT_PERIOD
  description: 2026년 제1기 일반과세자의 과세기간은 1월 1일부터 6월 30일까지
  source: 부가가치세법 제5조 및 국세청 부가가치세 개요 https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7693&mi=2401
  effective_period: 2026-01-01/2026-06-30
  verified: true
  verification_note: 국세청 과세기간 표와 2026년 제1기 예정신고 안내 https://www.nts.go.kr/nts/na/ntt/selectNttInfo.do?nttSn=1350085
    확인
- rule_id: VAT_PREPAID
  description: 확정신고 세액에서 입력에 명시된 같은 과세기간 예정고지 납부세액을 차감
  source: 부가가치세법 제49조 및 국세청 부가가치세 개요 https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7693&mi=2401;
    공식 화물운수업 신고서 PDF 3쪽 https://www.nts.go.kr/comm/nttFileDownload.do?fileKey=4548e87d3b83680b1052815001597b9d
  effective_period: 2026-01-01/2026-06-30
  verified: true
  verification_note: 공식 도소매업 예정고지 150만원 및 화물운수업 예정고지 120만원 차감 결과 검증. 예정고지 자체의 50%
    계산은 생성하지 않고 실제 고지 납부액을 입력 사실로 제공
- rule_id: VAT_RECEIPT_BASE
  description: 신용카드와 현금영수증 발행 금액은 부가세 포함 금액을 사용하고 동일 거래 세금계산서 발급분은 제외
  source: 국세청 2024년 제2기 확정 도소매업 신고서 작성사례 PDF 2~3쪽 https://www.nts.go.kr/comm/nttFileDownload.do?fileKey=95e20f2fcbd5b8094e3899abd6609bc2
  effective_period: 2026-01-01/2026-06-30
  verified: true
  verification_note: 중복분을 제외한 카드와 현금영수증 공급가액 1400만원에 부가세 포함 발행금액 1540만원 적용. 매출 거래
    상대방이 개인인지 여부만으로 공제를 제한하지 않음
- rule_id: VAT_SETTLEMENT
  description: 매출세액에서 공제가능 매입세액과 발행세액공제 및 예정고지 납부액을 차감해 신고서 납부 또는 환급 세액 산출
  source: 부가가치세법 제37조 및 제49조; 국세청 공식 도소매업과 화물운수업 신고서 작성사례 https://www.nts.go.kr/nts/na/ntt/selectNttInfo.do?nttSn=1339198
  effective_period: 2026-01-01/2026-06-30
