- rule_id: B.ORDINARY
  description: 정기적 일률적인 소정근로 대가인 기본급과 직무수당 및 정액식대를 월 통상임금에 포함. 원 분수 유지 및 항목별 원 미만 올림은 합성 계약 명시 기준.
  source: "고용노동부 개정 통상임금 노사지도 지침(2025.2.6), https://www.moel.go.kr/local/busan/news/notice/noticeView.do?bbs_seq=20250200564 ; 근로기준법 시행령 제6조. 단수 올림은 시나리오 합성 계약."
  effective_period: "2026"
  verified: false
  verification_notes: 원문 법정 개념 확인. 이 엔진 구성과 직접 일치하는 공단 독립 수치 예시 및 합성 단수 약정의 공식 예시는 없음.
- rule_id: B.OVERTIME
  description: 상시 5인 이상 평일 연장근로에 실제 근로 대가와 50% 가산 지급. 휴일 분을 연장 분에서 제외.
  source: "근로기준법 제56조제1항. https://1350.moel.go.kr/rtmview.do?id=1000297880"
  effective_period: "2026"
  verified: false
  verification_notes: 법정 배율은 확인. 독립 공식 계산 예시 대신 합성 경계 테스트 사용.
- rule_id: B.NIGHT
  description: 22시부터 06시까지 야간근로에 통상임금 50% 가산. 연장 또는 휴일 중복에도 추가.
  source: "근로기준법 제56조제3항. https://1350.moel.go.kr/rtmview.do?id=1000297880"
  effective_period: "2026"
  verified: false
  verification_notes: 법정 배율 및 중복은 확인. 독립 공식 수치 예시 미확보.
- rule_id: B.HOLIDAY
  description: 법정 유급휴일 1일 8시간 이내 150% 및 초과 200% 지급. 휴일 가산과 연장 가산을 별도 중복하지 않음.
  source: "근로기준법 제56조제2항. https://1350.moel.go.kr/rtmview.do?id=1000292921 ; https://www.moel.go.kr/minwon/fastcounsel/fastcounselView.do?inetDcssMngId=202212191019175521000"
  effective_period: "2026"
  verified: false
  verification_notes: 법정 배율 확인. 독립 공식 수치 예시 미확보.
- rule_id: B.WEEKLY
  description: 4주 평균 주 소정근로 15시간 이상이고 개근한 주의 주휴시간은 주40시간에 비례. 월급 포함분 중복 지급 금지.
  source: "근로기준법 제18조제3항 및 제55조. https://www.moel.go.kr/mainpop2.do ; https://1350.moel.go.kr/rtmview.do?id=1000278823&page=1&type=ALL"
  effective_period: "2026"
  verified: false
  verification_notes: 고용노동부 20시간 사례의 산식 확인. 원 단위 결과가 기재된 독립 공식 예시는 미확보.
- rule_id: B.MEAL_EXEMPT
  description: 식사를 별도 제공받지 않는 근로자의 식대는 월20만원까지 비과세. 비과세 여부와 통상임금 여부는 서로 별도로 적용.
  source: "소득세법 제12조제3호 러목. https://b.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7867&mi=6431"
  effective_period: "2026"
  verified: false
  verification_notes: 법령 기준 확인. 엔진 입력 구성의 독립 공식 수치 예시 미확보.
- rule_id: B.GROSS
  description: 지급항목 합계와 식대 비과세 차감 후 간이세액표용 월 급여 산출.
  source: "소득세법 제20조 및 제12조. 시나리오의 합성 근로계약에 정한 지급항목 합산."
  effective_period: "2026"
  verified: false
  verification_notes: 합성 계약 기반 산술 검증. 공식 자료의 실제 급여명세서 예시와 동일한 구성은 없음.
- rule_id: B.PENSION
  description: 공단 통지 기준소득 신고액 천원 미만 버림. 2026 근로자4.75%. 1~6월 40만원~637만원, 7~12월 41만원~659만원. 보험료10원 미만 버림.
  source: "국민연금공단 2026 Q&A, https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0097M0.do ; 2025.7 상하한 https://www.nps.or.kr/html/download/memberGuide_2.pdf ; 국민연금법 제117조 및 국고금관리법 제47조."
  effective_period: "2026-01-01~2026-12-31. 상하한 변경 2026-07-01"
  verified: true
  verification_notes: 공단이 직접 제시한 기준소득월액100만원 47,500원 및200만원95,000원. 263만6천원125,210원 및395만4천원187,810원 예시 회귀 포함.
- rule_id: B.HEALTH
  description: 고지 보수월액에 근로자3.595% 적용. 근로자 부담 하한10,080원 및 상한4,591,740원. 10원 미만 버림.
  source: "국민건강보험공단 2026 요율, https://edi.nhis.or.kr/portal/images/popup/20251204_pop01longdesc.html ; 보건복지부고시 제2025-222호, https://www.nhis.or.kr/lm/lmxsrv/law/lawFullContent.do?SEQ=39&SEQ_HISTORY= ; 국민건강보험법 제107조."
  effective_period: "2026-01-01~2026-12-31"
  verified: false
  verification_notes: 공식 요율7.19%와 50% 부담 및 상하한 확인. 산술 파생 경계 테스트이며 독립 공식 납부액 예시 미확보.
- rule_id: B.LONG_TERM_CARE
  description: 근로자 건강보험료에0.9448%/7.19%의 정확한 비율 적용 후10원 미만 버림. 13.14%를 중간 근사하여 적용하지 않음.
  source: "국민건강보험공단 2026 보험료율 인상 안내, https://edi.nhis.or.kr/portal/images/popup/20251204_pop01longdesc.html ; 노인장기요양보험법 제9조 및 제11조."
  effective_period: "2026-01-01~2026-12-31"
  verified: false
  verification_notes: 원문 정확한 산식 확인. 독립 공식 수치 예시 미확보.
- rule_id: B.EMPLOYMENT
  description: 고지 월평균보수에 실업급여 근로자0.9% 적용. 시나리오 약정에 따라10원 미만 버림.
  source: "고용노동부 고용보험 안내, https://ei.work24.go.kr/ei/eih/eg/ei/eiEminsr/retrieveEi0102Info.do ; 고용보험 및 산업재해보상보험의 보험료징수 등에 관한 법률 제13조 및 제16조의2."
  effective_period: "2026"
  verified: false
  verification_notes: 공식0.9% 확인. 급여에서 항목별10원 버림은 명시 합성 약정으로 고지 납부액과 급여 공제액의 차이 가능성을 범위 밖으로 둠. 공식 수치 예시 미확보.
- rule_id: B.TAX_TABLE
  description: 공식 소득세법 시행령 별표2의 월급여 구간646행과 본인포함 가족수1~11 열을 원문 그대로 조회. 월급여 정확히1000만원 행과 초과분 공식 산식 별도 적용.
  source: "소득세법 시행령 별표2(2026.2.27 개정), https://www.law.go.kr/LSW/flDownload.do?flSeq=164357181 ; 독립 대조용 국세청2023 XLSX https://www.nts.go.kr/nts/na/ntt/selectNttInfo.do?nttSn=1322151"
  effective_period: "2026. 기본 표 수치646행은 국세청2023 XLSX와 전부 동일"
  verified: true
  verification_notes: 7,106개 가족별 원문 셀을 PDF에서 추출하고 NTS XLSX 전 셀과 대조. 독립 수치 회귀용30개 셀과 원문 파일 해시 보관.
- rule_id: B.CHILD_CREDIT
  description: 1~2월은 자녀1명12,500원 및2명29,160원. 3~12월은1명20,830원 및2명45,830원. 세 번째 이상 추가1명당25,000원 또는33,330원. 음수0 처리.
  source: "국세청 기존 원천징수 안내 https://b.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7862&mi=6426 ; 소득세법 시행령 별표2 제3호(2026.2.27 개정), https://www.law.go.kr/LSW/flDownload.do?flSeq=164357181 ; 대통령령 제36129호 부칙 제1조제3호 및 제15조 https://www.law.go.kr/LSW/lsRvsDocListP.do?chrClsCd=010202&lsId=003956&lsRvsGubun=all"
  effective_period: "2026-01-01~2026-02-28 기존 공제. 2026-03-01 이후 개정 공제"
  verified: false
  verification_notes: 두 시점의 공제금액과 2026년3월1일 이후 원천징수 적용은 대통령령 제36129호 부칙 원문으로 확인. 다만 신 공제액을 적용한 전체 급여의 독립 공식 수치 예시는 미확보. 국세청 일반 안내는10월 조회 당시에도 구 공제액 표시.
- rule_id: B.WITHHOLDING
  description: 표 세액에서 자녀 공제 후80% 및100% 또는120% 선택 비율 적용. 10원 미만 버림. 소득세법제86조에 따라 지급 건별1000원 미만 부징수.
  source: "소득세법 시행령 제194조. 국세청 공식 사례20,180원 및80%16,140원/120%24,210원 https://b.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7862&mi=6426 ; 소득세법 제86조 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0086&lsiSeq=280405&urlMode=lsScJoRltInfoR ; 국고금관리법제47조."
  effective_period: "2026"
  verified: true
  verification_notes: 국세청 구 자녀공제2명 사례와 선택 비율3개 결과를1~2월 날짜로 회귀 검증. 개정 자녀공제 시행일의 증거 한계는 B.CHILD_CREDIT 참조.
- rule_id: B.LOCAL_TAX
  description: 특별징수 소득세의10%에 지방세기본법 끝수 처리 적용. 10원 미만 버림.
  source: "지방세법 제103조의13 https://law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1031061107 ; 지방세기본법 제55조(끝수 계산)."
  effective_period: "2026"
  verified: false
  verification_notes: 법령 요율 확인. 독립 공식 월급여 계산 예시 미확보.
- rule_id: B.NET
  description: 총지급액에서 근로자 부담 국민연금과 건강보험 및 장기요양, 고용보험, 원천징수 소득세와 지방소득세 차감.
  source: "근로기준법 제43조. 국민연금공단 사업장보험 부담 안내 https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0097M0.do . 합성 급여 산술 항목 합계."
  effective_period: "2026"
  verified: false
  verification_notes: 독립 공식 급여명세서 전체 수치 예시 미확보. 정산 및 체납 공제를 포함하지 않으며 공제액이 지급액을 초과한 입력은 거부.
