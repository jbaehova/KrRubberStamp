- rule_id: VAT_PERIOD
  description: 2026년 제1기 일반과세자의 과세기간은 1월 1일부터 6월 30일까지
  source: "부가가치세법 제5조 및 국세청 부가가치세 개요 https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7693&mi=2401"
  effective_period: "2026-01-01/2026-06-30"
  verified: true
  verification_note: "국세청 과세기간 표와 2026년 제1기 예정신고 안내 https://www.nts.go.kr/nts/na/ntt/selectNttInfo.do?nttSn=1350085 확인"
- rule_id: VAT_DEDUP
  description: 실제 거래 고유번호가 같은 증빙은 공급가액과 세액을 한 번만 집계
  source: "국세청 2024년 제2기 확정 도소매업 신고서 작성사례 PDF 2~3쪽 https://www.nts.go.kr/comm/nttFileDownload.do?fileKey=95e20f2fcbd5b8094e3899abd6609bc2"
  effective_period: "2026-01-01/2026-06-30"
  verified: true
  verification_note: "세금계산서와 신용카드 중복 공급가액 1000만원이 기재되고 중복 제외 과세표준 1억500만원이 신고서에 계산됨. transaction_id와 모순 증빙 거절은 데이터셋 업무 규약"
- rule_id: VAT_TAX_BASE
  description: 부가세 별도 공급가액 또는 정확히 분리되는 부가세 포함 금액에서 과세표준을 계산
  source: "부가가치세법 제29조 https://www.law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1032154833 및 국세청 도소매업 신고서 2~3쪽 https://www.nts.go.kr/comm/nttFileDownload.do?fileKey=95e20f2fcbd5b8094e3899abd6609bc2"
  effective_period: "2026-01-01/2026-06-30"
  verified: true
  verification_note: "17개 공식 공급가액 및 세액 표 항목. 입력 거래는 공급가액과 10% 세액을 원 단위 정수로 정확히 분리할 수 있는 범위로 제한"
- rule_id: VAT_OUTPUT_10
  description: 국내 과세 재화와 용역의 공급가액에 부가가치세 10% 적용
  source: "부가가치세법 제30조 및 국세청 세무 안내 https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=239004&mi=40574"
  effective_period: "2026-01-01/2026-06-30"
  verified: true
  verification_note: "국세청 도소매업과 화물운수업 공식 표 항목 및 완성 신고서 회귀 검증"
- rule_id: VAT_INPUT_EVIDENCE
  description: 사업 관련 적격 세금계산서와 세액이 구분된 신용카드 및 현금영수증의 매입세액을 공제
  source: "부가가치세법 제38조 및 제46조제3항 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0046&lsiSeq=276117&urlMode=lsScJoRltInfoR; 국세청 도소매업 신고서 작성사례 PDF 2~3쪽 https://www.nts.go.kr/comm/nttFileDownload.do?fileKey=95e20f2fcbd5b8094e3899abd6609bc2"
  effective_period: "2026-01-01/2026-06-30"
  verified: true
  verification_note: "공식 사례의 사업용 카드와 개인용 카드로 결제한 사업 광고비 모두 공제. 공급자는 일반과세자이며 수령명세서를 제출하고 증빙을 보관하는 사실을 입력에 명시"
- rule_id: VAT_NONBUSINESS
  description: 사업과 직접 관련 없는 지출 및 대표 개인 가사 지출의 매입세액 불공제
  source: "부가가치세법 제39조제1항제4호 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0039&lsiSeq=276117&urlMode=lsScJoRltInfoR; 국세청 사업용 신용카드 안내 https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7799&mi=6583"
  effective_period: "2026-01-01/2026-06-30"
  verified: false
  legal_verified: true
  verification_note: "공식 법령과 불공제 분류는 확인. 독립된 공식 금액 계산 사례는 확보하지 못해 법식 유도 테스트만 존재"
- rule_id: VAT_HOSPITALITY
  description: 기업업무추진비인 거래처 접대 지출에 관련된 매입세액 불공제
  source: "부가가치세법 제39조제1항제6호 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0039&lsiSeq=276117&urlMode=lsScJoRltInfoR; 국세청 매입세액 안내 https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7802&mi=2480"
  effective_period: "2026-01-01/2026-06-30"
  verified: false
  legal_verified: true
  verification_note: "법령상 불공제 확인. 공식 독립 숫자 사례 미확보. 가상 접대비 테스트를 공식 예시로 주장하지 않음"
- rule_id: VAT_PASSENGER_CAR
  description: 소매업의 개별소비세 과세대상 승용자동차 구입과 임차 및 유지 매입세액 불공제
  source: "부가가치세법 제39조제1항제5호 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0039&lsiSeq=276117&urlMode=lsScJoRltInfoR; 국세청 매입세액 안내 https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7802&mi=2480"
  effective_period: "2026-01-01/2026-06-30"
  verified: false
  legal_verified: true
  verification_note: "직접 영업용 제외 문구를 포함한 법령 확인. 공식 독립 승용차 불공제 금액 사례 미확보. 화물트럭 공제는 공식 도소매업 사례로 별도 검증"
- rule_id: VAT_EXEMPT_LAND
  description: 면세사업에 직접 사용한 매입 및 토지 관련 매입세액 불공제
  source: "부가가치세법 제39조제1항제7호 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0039&lsiSeq=276117&urlMode=lsScJoRltInfoR"
  effective_period: "2026-01-01/2026-06-30"
  verified: false
  legal_verified: true
  verification_note: "면세사업 직접 귀속과 토지 자체의 조성 지출만 구현. 개별 집필 문항에 포함 가능하나 독립 공식 숫자 사례는 미확보. 과면세 공통매입 안분은 구현 및 평가 범위에서 제외"
- rule_id: VAT_RECEIPT_BASE
  description: 신용카드와 현금영수증 발행 금액은 부가세 포함 금액을 사용하고 동일 거래 세금계산서 발급분은 제외
  source: "국세청 2024년 제2기 확정 도소매업 신고서 작성사례 PDF 2~3쪽 https://www.nts.go.kr/comm/nttFileDownload.do?fileKey=95e20f2fcbd5b8094e3899abd6609bc2"
  effective_period: "2026-01-01/2026-06-30"
  verified: true
  verification_note: "중복분을 제외한 카드와 현금영수증 공급가액 1400만원에 부가세 포함 발행금액 1540만원 적용. 매출 거래 상대방이 개인인지 여부만으로 공제를 제한하지 않음"
- rule_id: VAT_CREDIT_ELIGIBILITY
  description: 소비자 상대 사업 개인사업자에 한해 적용하며 법인 및 전년도 사업장별 공급가액 10억원 초과 개인사업자는 제외
  source: "부가가치세법 제46조제1항 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0046&lsiSeq=276117&urlMode=lsScJoRltInfoR; 국세청 세무 안내 https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=239004&mi=40574"
  effective_period: "2026-01-01/2026-06-30"
  verified: false
  legal_verified: true
  verification_note: "대상 제한은 공식 안내로 확인. 정확히 10억원과 10억원 초과 및 법인 제외 숫자 경계는 법식 유도 테스트이며 독립 공식 금액 계산 사례 없음"
- rule_id: VAT_CREDIT_RATE_2026
  description: 2026년 12월 31일까지 신용카드와 현금영수증 발행금액의 1.3% 공제
  source: "부가가치세법 제46조제1항제3호 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0046&lsiSeq=276117&urlMode=lsScJoRltInfoR; 국세청 도소매업 신고서 PDF 3쪽 https://www.nts.go.kr/comm/nttFileDownload.do?fileKey=95e20f2fcbd5b8094e3899abd6609bc2"
  effective_period: "2026-01-01/2026-06-30"
  verified: true
  verification_note: "법령에서 우대율 적용기한 확인. 공식 도소매업 1540만원 * 1.3% = 200200원 회귀 검증. 원 미만 공제액은 버리는 입력 계약으로 계산하며 공식 사례 외 끝수 경계는 자체 검사"
- rule_id: VAT_CREDIT_ANNUAL_LIMIT
  description: 2026년 신용카드 등 발행세액공제 연간 한도 1000만원에서 이미 공제한 금액을 차감
  source: "부가가치세법 제46조제1항제3호 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0046&lsiSeq=276117&urlMode=lsScJoRltInfoR"
  effective_period: "2026-01-01/2026-06-30"
  verified: false
  legal_verified: true
  verification_note: "법령상 금액과 적용기한 확인. 공식 한도 도달 계산 사례는 확보하지 못해 법식 유도 테스트. 입력에 명시한 올해 기공제액을 남은 한도 계산에 사용"
- rule_id: VAT_CREDIT_PAYABLE_LIMIT
  description: 발행세액공제는 차감 전 양수 납부세액을 한도로 하며 초과액으로 환급을 만들지 않음
  source: "부가가치세법 제46조제2항 https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0046&lsiSeq=276117&urlMode=lsScJoRltInfoR; 국세청 도소매업 신고서 PDF 3쪽 https://www.nts.go.kr/comm/nttFileDownload.do?fileKey=95e20f2fcbd5b8094e3899abd6609bc2"
  effective_period: "2026-01-01/2026-06-30"
  verified: false
  legal_verified: true
  verification_note: "법령상의 발행 공제 자체로 환급을 만들 수 없는 제한 확인. 공제를 제한한 뒤 예정고지를 차감하며 예정고지 초과 납부로 환급 가능. 공식 한도 초과 수치 사례 미확보"
- rule_id: VAT_PREPAID
  description: 확정신고 세액에서 입력에 명시된 같은 과세기간 예정고지 납부세액을 차감
  source: "부가가치세법 제49조 및 국세청 부가가치세 개요 https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7693&mi=2401; 공식 화물운수업 신고서 PDF 3쪽 https://www.nts.go.kr/comm/nttFileDownload.do?fileKey=4548e87d3b83680b1052815001597b9d"
  effective_period: "2026-01-01/2026-06-30"
  verified: true
  verification_note: "공식 도소매업 예정고지 150만원 및 화물운수업 예정고지 120만원 차감 결과 검증. 예정고지 자체의 50% 계산은 생성하지 않고 실제 고지 납부액을 입력 사실로 제공"
- rule_id: VAT_SETTLEMENT
  description: 매출세액에서 공제가능 매입세액과 발행세액공제 및 예정고지 납부액을 차감해 신고서 납부 또는 환급 세액 산출
  source: "부가가치세법 제37조 및 제49조; 국세청 공식 도소매업과 화물운수업 신고서 작성사례 https://www.nts.go.kr/nts/na/ntt/selectNttInfo.do?nttSn=1339198"
  effective_period: "2026-01-01/2026-06-30"
  verified: true
  verification_note: "도소매업 납부 1099800원과 화물운수업 납부 1250000원 일치. 실제 은행 국고 수납의 10원 미만 단수와 구분되는 신고서 원 단위 세액"
- rule_id: VAT_ACTIVITY_EVIDENCE
  description: "개별 집필 활동 기록의 실제 참여자와 장소 및 증빙번호를 연결해 엔진용 매입 사실을 복원"
  source: "DATA_SPEC.md의 개별 집필 사실 복원 계약 및 reports/vat_evidence_contract.md의 vat_activity_evidence_v1 계약"
  effective_period: "2026-01-01/2026-06-30"
  verified: false
  verification_note: "업무 데이터 계약이다. 정부가 발표한 법규나 공식 숫자 사례로 주장하지 않는다. 공제 법규는 기존 VAT_HOSPITALITY, VAT_NONBUSINESS, VAT_PASSENGER_CAR, VAT_EXEMPT_LAND 및 VAT_INPUT_EVIDENCE가 처리한다. 원자료의 모호한 활동과 상충하는 연결은 거절한다."
