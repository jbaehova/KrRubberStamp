    사례로 검증한 것은 아님.
- rule_id: A_HOUSING
  description: 2025 장기주택저당차입금 이자공제. 적격 증빙 확인된2012년 이후 차입의 기간과 상환방식별600/800/1800/2000만원 한도. 연말 세대 주택 수가0또는1인
