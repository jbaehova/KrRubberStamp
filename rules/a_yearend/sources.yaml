    사망 자녀를 포함한 가족의 누적 출생 및 입양 신고 순서이며 매년 초기화하지 않음
  source: 소득세법 제59조의2; 국세청 https://j.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7875&mi=6439 ; 2025
