[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "KrRubberStamp"
version = "0.1.0"
description = "Korean office rubber stamp, as an AI benchmark dataset — auto-graded tasks on year-end tax, payroll, VAT, and document extraction."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.23", "reportlab>=4.2", "openpyxl>=3.1", "Pillow>=11", "pypdf>=5", "pymupdf>=1.25", "httpx>=0.28", "fonttools>=4.55"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.9", "pre-commit>=4"]

[project.scripts]
krt = "KrRubberStamp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["KrRubberStamp", "rules", "scenarios", "render", "grader", "harness", "validate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
