instruction: 대피소 세 곳의 물품 보충이 끝났습니다. 다음 주 추가 발주에 쓸 수 있도록 첨부한 세 건의 구매 명세에서 품목별로 가장 낮은
  공급가액 단가와 그 업체를 찾아 주세요. 세 건의 부가세 포함 지출 총액도 알려 주세요. 견적이 아니라 서로 다른 납품을 실제 인수한 자료이며
  세 건을 모두 집계합니다. 모든 단가는 부가세 별도이고 모든 품목의 수량 단위는 개입니다. answer.json에는 cheapest_by_item과
  grand_total만 작성하세요. 품목명은 NFKC 정규화 후 공백을 제거하고 영문은 소문자로 바꾸세요. 업체명도 같은 방식으로 정규화하고 주식회사,
  (주), ㈜ 표기를 제거하세요. cheapest_by_item은 정규화 품목명 오름차순입니다. 단가가 같으면 정규화 업체명 오름차순의 첫 업체를
  고릅니다. 각 품목의 공급가액은 수량 곱하기 단가이며 그 금액의 10%에서 원 미만을 버린 부가세를 더합니다.
