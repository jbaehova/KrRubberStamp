instruction: 전시관 음성 해설 제작 사업의 장비 구입비를 마감하려고 합니다. 본관 녹음실과 순회 녹음팀에서 실제 인수한 다섯 건을 모두
  합산해 업체별 공급가액, 부가세와 총액을 정리해 주세요. 사업 전체 공급가액 합계, 부가세 합계와 지출 총액도 필요합니다. 일부 판매처는 부가세
  포함 단가를 기재했으므로 문서별 price_includes_vat를 확인하세요. 품목 수량 단위는 모두 개입니다. 부가세 포함 거래는 각 품목의
  수량 곱하기 단가를 총액으로 보고 총액 곱하기 10 나누기 11에서 원 미만을 버려 공급가액을 구한 뒤 차액을 부가세로 처리하세요. 부가세 별도
  거래는 각 품목의 수량 곱하기 단가를 공급가액으로 보고 그 금액의 10%에서 원 미만을 버려 부가세를 구하세요. answer.json에는 vendor_totals,
  supply_total, vat_total, grand_total만 작성하세요. 업체명은 NFKC 정규화 후 공백과 주식회사, (주), ㈜ 표기를
  제거하고 영문은 소문자로 바꾸세요. vendor_totals는 정규화 업체명 오름차순입니다.
