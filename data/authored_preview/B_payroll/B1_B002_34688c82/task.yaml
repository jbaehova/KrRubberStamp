instruction: '가상저녁책방의 가상이루 직원이 4월 주휴수당을 문의했습니다. 계약서와 근태표를 대조하고 승인된 무급 결근 한 건을 반영해
  설명에 사용할 숫자를 구해 주세요. 4월 중 도래한 일요일 네 번의 주휴가 이번 마감 대상이며 5월 3일 주휴는 다음 마감에서 처리합니다. 결근확인서는
  근태표와 같은 한 건을 증명하므로 두 번 차감하지 마세요. 아래 항목을 원 단위 정수로 작성해 주세요.


  - base_pay: 정규 유급 근로분의 임금

  - weekly_holiday_pay: 별도로 지급할 주휴수당

  - gross_pay: 총지급액

  - total_deductions: 보험료와 원천세 공제 합계

  - net_pay: 5월 8일 이체액'
