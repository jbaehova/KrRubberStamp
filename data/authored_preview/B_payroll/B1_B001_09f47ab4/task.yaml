instruction: '가상모닝제본 급여 담당입니다. 외주 담당자의 명세서가 아직 안 와서 가상서연의 4월 이체 승인표를 먼저 채우려고 합니다.
  계약서와 마감표를 보고 아래 네 칸을 원 단위 정수로 작성해 주세요. 추가 근무나 별도 지급 건은 없습니다. 보험료는 마감표의 공단 통지 기준액으로
  계산하고 첨부한 공식 기준을 적용해 주세요.


  - gross_pay: 총지급액

  - non_taxable_pay: 비과세 지급액

  - total_deductions: 근로자 부담 보험료와 세금의 공제 합계

  - net_pay: 실제 이체할 금액'
