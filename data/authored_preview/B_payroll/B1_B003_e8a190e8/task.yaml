instruction: '가상야간복구의 2월 급여 초안을 다시 확인해 주세요. 가상도윤 급여는 2월 27일 이체 계획이 취소되어 3월 3일 실제 지급했습니다.
  근태 초안에는 일요일 작업이 평일 연장란에도 복사되어 있었고 최종 승인본은 따로 첨부했습니다. 휴일 작업의 휴게시간을 뺀 실제 근로와 야간 겹침을
  확인해 중복 지급을 막아 주세요. 회사는 현금 식대 외에 실제 식사도 제공했습니다. 승인 문서와 실제 지급일을 기준으로 아래 항목을 원 단위 정수로
  작성해 주세요. 수당 계산에서 통상시급을 먼저 정수로 잘라 계산하지 마세요.


  - ordinary_hourly_wage_floor: 통상시급 표시액

  - overtime_pay: 평일 연장수당

  - holiday_pay: 휴일수당

  - night_pay: 야간 가산분

  - non_taxable_pay: 비과세 지급액

  - taxable_pay: 원천징수 대상 급여

  - income_tax: 소득세

  - local_income_tax: 지방소득세

  - net_pay: 최종 실지급액'
