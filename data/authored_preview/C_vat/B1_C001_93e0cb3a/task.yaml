instruction: 가상다시쓰는주방의 상반기 매장을 맡게 된 새 경리입니다. 매출표의 결제금액과 매입자료의 공급가액을 같은 기준으로 정리하고,
  다음 달 세금 계좌에 옮길 부가세 금액을 확인해 주세요. 첨부한 세 자료에 나온 거래가 이번 신고 대상의 전부입니다. 매출 공급가액(tax_base)과
  매출세액(output_vat)을 먼저 구해 주세요. 공제할 매입세액(deductible_input_vat)과 영수증 발행세액공제(receipt_credit)를
  반영한 최종 납부액(payable_vat)을 원 단위 정수로 계산하여 answer.json에 저장해 주세요.
