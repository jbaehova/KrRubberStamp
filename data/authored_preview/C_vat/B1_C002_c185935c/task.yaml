instruction: 가상한칸목공방에서 상반기 부가세 초안을 요청했습니다. 체험 손님 결제표와 기업 납품 계산서가 따로 있고, 대표 카드로 결제한
  광고와 식사도 함께 들어 있습니다. 마지막 활동기록으로 식사의 사용 목적을 확인해 주세요. 매출 공급가액(tax_base)과 매출세액(output_vat)을
  구한 뒤 매입세액 합계(input_vat)를 공제불가 세액(noncreditable_vat)과 공제가능 세액(deductible_input_vat)으로
  구분해 주세요. 영수증 발행세액공제(receipt_credit)를 반영한 최종 납부액(payable_vat)까지 원 단위 정수로 계산하여 answer.json에
  저장해 주세요.
