instruction: 가상별숲 건축사무소 급여 담당자입니다. 가상서유진 직원의 제출 화면에서 성년 아들과 어머니가 모두 가족 공제 대상처럼 묶여
  보여서 그대로 마감하기 어렵습니다. 가족 확인서와 장애인 증명, 어머니 소득 확인을 맞춰 본인을 제외한 기본공제 가능 가족 수를 알려 주세요.
  기본공제액과 추가공제액, 자녀 세액공제액도 필요합니다. 가족별 요건에 맞춘 카드 소득공제액을 구하고, 아들 보험료와 장학금을 받은 등록금 및 어머니
  보전금이 있는 병원비를 반영한 보험료와 교육비 및 의료비 세액공제액을 작성해 주세요. 마지막으로 소득세와 지방소득세의 결정세액 및 차감징수세액을
  각각 구해 두 차감징수액의 합계까지 답안 스키마에 넣어 주세요. 환급은 음수로 표시해 주세요.
