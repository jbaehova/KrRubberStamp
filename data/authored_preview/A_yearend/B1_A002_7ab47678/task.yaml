instruction: 가상다솜 편집실의 연말정산 담당자입니다. 4월에 입사한 가상문하린 직원이 간소화 자료를 연간 전체로 내려받았습니다. 급여 자료는
  우리 회사분만 있고, 카드 명세와 병원 영수증에는 입사 전 지출도 섞여 있어요. 입사일과 각 지출 날짜를 맞춰 카드 소득공제액과 의료비 세액공제액을
  계산해 주세요. 총급여와 과세표준도 함께 남겨 주시고, 소득세 및 지방소득세의 결정세액과 차감징수세액을 각각 작성해 주세요. 두 차감징수액의 합계까지
  답안 스키마에 담고 환급이면 음수로 표시해 주세요.
