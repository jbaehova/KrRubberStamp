instruction: 가상하늘빛 제작소의 급여 담당자입니다. 가상이도윤 직원은 첫 연말정산이라 연금저축 납입액을 환급액과 혼동하고 있어요. 총지급액에서
  비과세 금액을 뺀 총급여와 연금계좌 세액공제액을 확인한 뒤, 소득세와 지방소득세의 결정세액 및 기납부세액을 각각 작성해 주세요. 다음 급여에 반영할
  두 세금의 차감징수세액과 합계도 필요합니다. 답안 스키마에 맞춰 환급액은 음수로 표시해 주세요.
