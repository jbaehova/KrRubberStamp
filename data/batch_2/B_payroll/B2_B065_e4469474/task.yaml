instruction: 가상문서봉합실 같은 직원은10월 주20시간 계약에서11월 주40시간 계약으로 전환했습니다. 월 환산시간과 월 기본급이 함께
  바뀌었고 시간당 단가는 유지하도록 체결했습니다. 두 달 실제 추가작업은 각각2시간입니다. 월급 인상률을 기존 추가비용에 그대로 곱하지 말고 각
  완전 월의 payroll_calculations와 employee_settlements를 제출하세요.
