instruction: 가상봉함실 두 시급제 직원의 노동절 기본 유급 대가를 마감합니다. 한쪽의 확정 정규 지급시간에는 유급 휴무 시간이 이미 들어가
  있고 다른 쪽 집계에는 실제 근로만 들어 있습니다. 각각의 포함 사실을 확인하여 기본 유급을 한 번씩만 지급한 payroll_calculations를
  제출하세요.
