instruction: 가상급여지원실은 서로 다른 두 고객사업장의 시급 종료 명세를 받았습니다. 두 직원의 소정시간과 노동절 실제 밤 작업은 같지만
  사업장 상시인원은 각각4명과5명입니다. 노동절 기본유급, 어린이날 휴무의 적용범위와 실제밤 가산을 구분하여 payroll_calculations와
  employee_settlements를 제출하세요.
