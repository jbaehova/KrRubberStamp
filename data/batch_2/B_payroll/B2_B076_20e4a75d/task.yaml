instruction: 가상윤곽교정실은 같은 10월 명세의 승인 원장을 교체했습니다. 원장 안의 근태카드 수정번호는 다시 시작했으므로 폐기된 원장의
  카드7을 새 원장의 카드2보다 우선하지 마세요. 먼저 완전 월 승인 원장을 선택한 다음 그 안에서 근태카드의 승인 최고 차수를 읽으세요. payroll_calculations와
  employee_settlements를 제출해 실제 이체 후 남은 금액까지 확인해 주세요.
input_files:
- path: inputs/01_구전체원장.pdf
