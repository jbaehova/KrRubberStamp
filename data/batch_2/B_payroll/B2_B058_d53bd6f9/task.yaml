instruction: 가상진열실에서 같은 기본 월급의 두 직원에게 서로 다른 작업을 배정했습니다. 한 직원은 소정 밤근로 세 시간이고 다른 직원은
  낮 추가근로 한 시간입니다. 담당자 확정 분 집계와 월급 포함 범위로 각 항목을 계산하세요. 합계가 우연히 같아도 항목을 복사하지 말고 payroll_calculations를
  제출하세요.
