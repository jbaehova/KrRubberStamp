instruction: 가상가등록실 두 직원의 이번 과세급여는 같습니다. 첫 직원은 당월 완료금이 합쳐진 것이고 두 번째 직원은 고정 기본급 재계약으로
  같은 금액이 됐습니다. 기관별 확정 공제기초도 같지만 통상임금은 다릅니다. 각각의 원천세와 표시 시급을 계산한 payroll_calculations를
  제출하세요. 같은 현재 과세액을 공통 통상임금으로 복사하지 마세요.
