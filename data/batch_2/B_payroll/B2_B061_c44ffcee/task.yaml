instruction: 가상사진분류실 두 계약의 기본급과 월 추가근로는 같습니다. 한 계약의18만원은 매달 동일하게 지급하는 소정근로 대가인 현금
  식대이고 다른 계약의18만원은 해당 월 검수 성과 달성에 따른 변동 완료금입니다. 양쪽 총약정 예산이 같다는 이유로 같은 추가수당과 과세액을 복사하지
  마세요. 완전 월 명세의 payroll_calculations와 employee_settlements를 제출하세요.
