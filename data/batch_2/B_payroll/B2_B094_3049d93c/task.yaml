instruction: 가상색인교환실 두 직원 장부가 같은 근태번호를 씁니다. 첫 직원의 근태와 은행 실행은 각각 사본이 하나씩 더 있고 두 번째
  직원의 같은 근태번호는 독립 실제근로입니다. 근태는 개인 범위, 은행은 회사 전체 실행번호 범위로 중복을 처리하여 payroll_calculations,
  employee_settlements와 paid_total을 제출하세요.
