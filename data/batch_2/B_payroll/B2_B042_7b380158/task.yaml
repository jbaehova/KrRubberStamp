instruction: 가상전사실의25일 현금 보고를 작성합니다. 직원A의 카드 최종 승인에서는 추가 출동이 소정 이동으로 정정됐고 직원B의 실제
  지급일은27일입니다. 각 완전 월 명세를 최종 원자료로 계산하고 직원번호 및 명세번호와 실제 지급일이 맞는 이체를 연결하세요. 마감 뒤 직원B
  현금은 현재 누계에서 제외하되 명세 채무는 남깁니다. payroll_calculations와 employee_settlements 및 paid_total을
  제출합니다.
