instruction: 가상전사실의 한 직원은11월과12월 완전 월 명세를 각각 받습니다.12월 재계약 시급이 인상됐지만 그달 소정근로 일수가 줄어
  기본 근로 임금은 우연히 같습니다. 각 월의 주휴 약정과 개근 집계까지 반영하여 payroll_calculations 및 employee_settlements를
  제출하세요. 실제 시간급이나 주휴 대가를 다른 달에서 복사하지 마세요.
