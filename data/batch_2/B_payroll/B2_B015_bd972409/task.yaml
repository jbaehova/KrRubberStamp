instruction: 가상예약실의 종료월 시급 명세에는 실제 소정근로와 근로자의 날 휴무 유급이 있습니다. 두 자료를 구분해 완전 월급을 계산하고
  실제 은행 이체와 대조하세요. payroll_calculations와 employee_settlements를 요청합니다. 쉬었던 근로자의 날을
  실제 출근 시간으로 넣지 않습니다.
