instruction: 가상표본실은 화요일 두 담당자를 각 세 시간 불렀습니다. 한 담당자의 약정 주휴일은 화요일이고 다른 담당자의 주휴일은 일요일입니다.
  담당자가 확정한 소집 집계와 지정 휴무 근거에 따라 두 완전 월 명세의 holiday_pay와 overtime_pay를 구분하고 실행 현금까지
  대조해 payroll_calculations를 제출하세요.
