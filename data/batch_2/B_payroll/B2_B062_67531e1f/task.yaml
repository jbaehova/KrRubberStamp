instruction: 가상배포실 두 담당자에게 같은 기본급과 식대를 지급합니다. 한 담당자는 회사 현물 식사를 제공받고 다른 담당자는 외부 근무로
  현물 식사를 전혀 제공받지 않습니다. 각 직원의 제공 사실을 과세 구분에 적용하고 두 실제 이체와 연결한 payroll_calculations
  및 employee_settlements를 제출하세요.
