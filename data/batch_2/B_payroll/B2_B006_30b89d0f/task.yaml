instruction: 가상자료관의 같은 직원은9월까지 월급 계약이고10월부터 짧은 시급 계약입니다. 두 달의 완전 명세를 각각 계약 방식과 확정
  부과 자료로 계산하고 급여번호별 은행 실행에 연결해 주세요. payroll_calculations와 employee_settlements를 제출합니다.
  이전 월의 고정 기본급이나 보험 회신을 새 계약에 그대로 옮기지 않습니다.
