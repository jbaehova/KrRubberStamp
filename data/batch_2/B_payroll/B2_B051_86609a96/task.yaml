instruction: 가상색인실 두 담당자의 정기 지급 항목 합계는 같습니다. 한 사람의 추가 금액은 매월 고정 역할수당이고 다른 사람의 금액은
  이번 달에만 발생한 완료금입니다. 똑같이 승인된 평일 두 시간 작업을 각 계약의 통상시급으로 계산하고 기존 실행액에 연결해 payroll_calculations와
  employee_settlements를 제출하세요.
