instruction: 가상자료채집실 한 직원의6월과7월 명세를 마감합니다.6월은 주20시간 세 개근 주이고7월은 주15시간 네 개근 주입니다. 확정
  실제근로는 서로 같고 주휴 지급시간도 우연히 같습니다. 각 월 보험 회신과 지급 이력을 포함하여 payroll_calculations와 employee_settlements를
  제출하세요.
