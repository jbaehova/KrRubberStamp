instruction: 가상연결제본의 가상백이솔이 상반기 회사와 하반기 회사에서 받은 원천증명서를 제출했습니다. 지급기간별 급여와 비과세를 합산한
  뒤 본인 직불 사용액의 연간 카드 공제를 계산하세요. 각 회사 급여에 카드 문턱을 따로 적용하지 말고 사용자별 원천 금액과 연간 급여 합계 및
  카드 계산이 든 세금 계산 객체를 회신합니다.
