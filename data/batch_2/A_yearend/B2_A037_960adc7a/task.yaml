instruction: 가상나눈발급의 가상나로운은 상반기 급여를 고친 수정차수 3 발급본과 별도 하반기 수정차수 1 발급본 및 자녀 등록을 제출했습니다.
  연간 파일 전체에서 수정차수 하나만 고르지 말고 지급기간별로 선택하세요. 사용자 합계와 채택 및 제외 번호를 회신하고 두 자녀 공제를 반영한 연간
  세금 계산 객체를 작성합니다.
