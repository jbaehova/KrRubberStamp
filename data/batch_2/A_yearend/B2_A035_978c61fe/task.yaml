instruction: 가상분리기록의 가상채은찬은 상반기 원천증명서에서 지방세만 정정한 발급본과 하반기 증명서를 제출했습니다. 지급기간별 최고 발급본을
  골라 국세와 지방세 기납부액을 독립적으로 합산하고 정산 결과를 회신하세요. 국세에 변동이 없다고 지방세 정정도 버리거나 국세의 10%로 지방세를
  다시 만들지 않습니다.
