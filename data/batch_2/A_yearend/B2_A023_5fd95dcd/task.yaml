instruction: 가상정정음반의 가상임다빈은 연간 원천증명서의 비과세액이 정정된 발급본과 이전 발급본 및 문화비 사용명세를 제출했습니다. 같은
  사용자와 같은 지급기간의 최고 발급 수정차수로 급여를 복원하여 문화비 적용을 계산하세요. 채택 및 제외 증명서 번호와 연간 지급액 및 비과세,
  카드 공제가 든 세금 계산 객체를 회신합니다.
