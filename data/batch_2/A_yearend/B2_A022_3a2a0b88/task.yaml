instruction: 가상같은액편집의 가상윤새론이 두 근무처의 같은 금액 원천증명서와 첫 근무처의 동일 번호 재전송본을 제출했습니다. 번호가 같은
  동일본은 한 번만 세되 금액이 같아도 다른 사용자의 별도 지급은 유지하세요. 복원한 총급여 기준으로 직불과 대중교통의 카드 기본 및 추가 상한을
  계산하고 사용자별 합계와 채택 번호 및 전체 세금 계산 객체를 회신합니다.
