instruction: 가상발급등대의 가상송시우가 같은 사용자의 두 지급기간 발급본과 상반기 정정 초안을 제출했습니다. 최고 수정차수라는 이유로 초안의
  원천징수액을 환급 계산에 넣지 말고 발급본만 합산하세요. 사용자별 합계와 채택 및 제외 번호, 국세 및 지방세 기납부액과 최종 정산 객체를 회신합니다.
