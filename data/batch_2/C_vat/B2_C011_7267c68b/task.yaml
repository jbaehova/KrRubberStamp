instruction: 가상잔결매장과 가상직선공방은 별개 납세자입니다. 첫 매장은 카드 판매분을 두 번 나눠 납부했고 공방은 한 번 송금했습니다.
  신고자료부터 각각 계산한 뒤 등록번호별 실제 납부와 잔액을 대조해 주세요. 전체 은행 합계만 보고 어느 납세자의 미납인지 생략하지 말고 filing_calculations와
  registration_settlements 및 balance_total을 answer.json에 넣어주세요.
