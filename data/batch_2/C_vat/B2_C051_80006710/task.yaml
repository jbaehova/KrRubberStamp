instruction: 가상윤곽디자인의 반기 공급은 전자 세금계산서 한 건으로 확정됐습니다. 은행은 실제 납부 실행과 그 뒤 이미 확인된 반환 실행을
  별도로 보내왔습니다. 신고세액을 먼저 계산하고 양방향 은행 실행의 순유출을 대조하여 filing_calculations와 registration_settlements
  및 paid_total과 received_total을 answer.json에 적어 주세요.
