instruction: 교정판과 지지대를 함께 확보합니다. 교정판은 가람의 마지막 포장 재고가 부족하고 나루의 도착일은 납기 뒤입니다. 두 업체의
  지지대 자체는 유효하므로 업체 전체를 부적격으로 지우지 마세요. 다솔 교정판을 기준으로 실제 지지대 구매처까지 다시 비교해 offer_comparisons와
  chosen_offers 및 vendor_cart_totals를 작성해 주세요.
