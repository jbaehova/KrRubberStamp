instruction: 검수 팔레트의 두 주문과 현금 집행을 원문 식별자로 정확히 대조하세요. 주문 및 지급 ID에는 이름 정규화를 적용하지 않습니다.
  각 반품은 정확한 주문과 행에서 빼고 서로 다른 지급 ID는 모두 반영합니다. 포함 및 별도 포장가격 약정을 따릅니다. answer.json에는
  line_settlements, item_quantities, vendor_balances, grand_total, payment_total,
  balance_total을 작성하세요. 주문과 행 및 정규화 품목과 업체의 이름순으로 배열합니다.
