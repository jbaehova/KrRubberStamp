instruction: 두 공급처에서 받은 같은 규격의 선반패드를 창고에서는 하나의 재고로 등록하고 지급 대장에서는 공급처별로 정산하세요. 인수 기록을
  원주문에 연결해 기초단위 개의 수량을 합칩니다. 같은 품목이라는 이유로 업체 대금이나 송금을 합쳐 하나의 업체 계정으로 만들지 않습니다. 각 주문의
  포함 포장가격으로 실인수 대금을 구하고 그 주문에 실행한 지급을 해당 업체에서만 차감하세요. answer.json에는 item_quantities와
  vendor_balances를 각각 품목 및 업체 이름순으로 작성합니다.
