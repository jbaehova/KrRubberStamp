instruction: 이동 수리 작업실 여덟 곳의 장비 조달 자료를 넘겨받았습니다. 업체별 지급 총액을 대조하고 다음 설치분의 품목별 최저 단가
  업체를 정해야 합니다. 재발급 PDF 한 장과 스캔 사본 한 장이 함께 들어 있으므로 같은 document_id의 내용이 동일한 자료는 한 번만
  집계하세요. 서로 다른 document_id는 같은 업체와 같은 품목이어도 각각 실제 인수한 거래입니다. 법인명 앞의 주식회사, (주), ㈜ 표기와
  공백 차이는 동일 업체를 뜻합니다. 모든 품목 규격과 수량 단위는 같고 단위는 개이며 품목 이름의 공백도 동일 품목의 표기 차이입니다. 부가세
  포함 단가는 각 품목의 수량 곱하기 단가를 총액으로 보고 총액 곱하기 10 나누기 11에서 원 미만을 버려 공급가액을 구한 뒤 차액을 부가세로
  처리하세요. 부가세 별도 단가는 수량 곱하기 단가를 공급가액으로 보고 그 금액의 10%에서 원 미만을 버려 부가세를 구하세요. 최저 단가 비교는
  공급가액 기준 개당 단가입니다. 부가세 포함 단가의 비교용 공급가액 단가는 기재 단가 곱하기 10 나누기 11에서 원 미만을 버린 값입니다. answer.json에는
  vendor_totals, cheapest_by_item, grand_total, unique_document_count만 작성하세요. 업체명과
  품목명은 NFKC 정규화 후 공백을 제거하고 영문은 소문자로 바꾸세요. 업체명에서는 법인 표기를 제거하세요. vendor_totals는 정규화
  업체명 오름차순이며 cheapest_by_item은 정규화 품목명 오름차순입니다. 최저 단가가 같으면 정규화 업체명 오름차순의 첫 업체를 고르세요.
  unique_document_count는 파일 수가 아니라 중복 제거 후의 서로 다른 거래 문서 번호 수입니다.
