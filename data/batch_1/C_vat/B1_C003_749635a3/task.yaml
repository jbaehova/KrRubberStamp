instruction: 가상모퉁이조명이 진열 공간을 확장한 뒤 상반기 환급 예상액을 확인하려고 합니다. 영업팀과 경리가 따로 모은 자료라 같은 주문의
  계산서와 카드 전표가 함께 있고, 6월에 주문받았지만 7월에 설치한 건도 들어 있습니다. 공급 완료일과 주문번호를 대조하여 이번 과세기간의 실제
  거래 수(unique_transaction_count), 매출 공급가액(tax_base) 및 매출세액(output_vat)을 구해 주세요. 공제가능
  매입세액(deductible_input_vat)과 이번에 적용할 영수증 발행세액공제(receipt_credit)를 계산해 주세요. 납부한 예정고지
  세액(prepaid_vat)을 차감한 최종 환급액(refund_vat)까지 원 단위 정수로 계산하여 answer.json에 저장해 주세요.
