instruction: 가상돌담관리의 가상신서호는 세대원으로 월세를 내고 배우자의 카드 자료도 제출했습니다. 같은 세대의 세대주가 주택청약저축 소득공제를
  신청한 사실과 배우자 소득 확인을 반영해 기본공제액, 월세 세액공제액 및 카드 소득공제액을 각각 구해 주세요. 직원의 연금저축과 IRP 한도도
  따로 계산합니다. 두 세금의 결정세액과 차감징수세액 및 정산 합계를 구해 급여 마감에 반영하며 환급은 음수로 적습니다.
