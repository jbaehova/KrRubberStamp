instruction: 가상동백기록의 가상길수안은 여러 기부 영수증을 냈고 아버지 영수증도 같이 넣었습니다. 아버지 영수증의 PDF와 이미지 납부
  식별기호를 대조하고 공제 배정을 확인해 기본공제액을 구해 주세요. 근로소득금액과 정치자금 및 고향사랑 기부 세액공제액을 먼저 계산하고 남는 소득
  범위로 특례 및 공익과 종교단체 기부의 일반 기부금 세액공제액을 구합니다. 소득세와 지방소득세 결정세액 및 두 세금 정산 합계도 적어 주세요.
  환급은 음수입니다.
