instruction: 가상소철편집의 가상제도은은 첫 취업을 마치고 11월에 퇴직했습니다. 재직 기간과 카드 및 학비, 보험과 진료 납부일을 맞춰
  각 공제액을 구해 주세요. 첫 근무일과 마지막 근무일의 지출을 빠뜨리지 않습니다. 퇴직 뒤 본인 연금계좌와 기부 납입은 별도 기준으로 계산해 주세요.
  산출세액과 소득세 결정세액 및 두 세금 정산 합계도 적고 환급은 음수로 표시합니다.
