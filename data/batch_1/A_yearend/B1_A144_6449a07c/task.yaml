instruction: 가상목련장비의 가상판서우 정산을 대조합니다. 주택대출의 계약 기간과 비거치 조건을 확인해 주택자금 소득공제액을 구해 주세요.
  확정 총급여로 문화비의 처리와 연금저축 및 IRP 한도를 판단해 카드 소득공제와 연금계좌 세액공제를 계산합니다. 소득 있는 아버지의 진료비는 실제
  보전액을 뺀 의료비 세액공제로 검토하고 교육비 및 보험료 세액공제와 최종 소득세도 적습니다.
