instruction: 가상풀꽃재생의 가상비서안은 큰 의료비와 연금 납입 및 어머니 기부 자료로 세금이 음수가 될 것으로 예상했습니다. 자녀의 근로소득
  확인과 보험 보전 및 연금 한도를 반영해 교육비와 의료비 및 연금계좌 공제액을 계산해 주세요. 산출세액과 근로소득세액공제 및 전체 세액공제 합계를
  구하고 결정 소득세와 지방소득세를 적습니다. 기납부세액을 대조한 정산 합계를 구하되 환급은 음수로 표시합니다.
