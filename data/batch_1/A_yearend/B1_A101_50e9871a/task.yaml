instruction: 가상모래빛조사의 가상은하정은 이혼 후 자녀를 부양하며 장애인 동생의 자료도 제출했습니다. 동생의 공제는 어머니에게 배정되어
  있습니다. 가족 수와 기본 및 추가공제액 및 자녀세액공제액을 구하고 학교 교육비와 사설 학원비 및 본인 대학원 수업료를 구분해 교육비 공제액을
  계산해 주세요. 본인과 동생 보험 및 자녀와 동생 의료비와 연금계좌 공제도 각각 확인해 소득세 결정세액을 적습니다.
