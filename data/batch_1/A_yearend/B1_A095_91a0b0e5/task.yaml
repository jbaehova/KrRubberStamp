instruction: 가상물결생명의 가상공유현은 본인 수술과 배우자 입원 및 올해 태어난 미숙아 진료와 난임 시술 자료를 제출했습니다. 가족 명세에
  맞춰 기본공제액과 자녀세액공제액을 구해 주세요. 보험금이 보전한 본인 수술비를 조정하고 일반 의료비 한도 및 진료 종류별 공제율을 적용해 의료비
  세액공제액을 계산합니다. 소득세 결정세액과 기납부액을 비교한 두 세금의 정산 합계도 적어 주세요. 환급은 음수입니다.
