instruction: 가상아카시아유통의 가상연태인은 보유 주택 대출 이자와 직장 근처 임차 주택 월세를 함께 신청했습니다. 세대의 주택 보유 확인과
  대출 조건을 읽어 월세 세액공제액과 주택자금 소득공제액을 구해 주세요. 확정 급여 구간에 맞춰 문화비와 자녀 카드, 연금저축 및 IRP를 처리해
  각 공제액도 계산합니다. 장학금을 뺀 자녀 학비와 자녀 보험료 세액공제 및 최종 소득세를 적습니다.
