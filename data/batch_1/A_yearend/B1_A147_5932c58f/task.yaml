instruction: 가상율마분석의 가상권새봄은 자료 제출 후 표준세액공제를 최종 확정했습니다. 이 선택에 맞춰 특별소득공제와 주택자금 소득공제
  및 일반 기부금 세액공제액을 적어 주세요. 동생 카드의 대상 범위를 확인하고 카드 소득공제액을 구합니다. 두 자녀의 일반 자녀 및 올해 출생 공제와
  연금계좌 공제, 본인과 배우자 정치자금 영수증을 각각 판단한 정치자금 공제 및 표준세액공제액도 계산해 주세요. 최종 소득세를 마감합니다.
