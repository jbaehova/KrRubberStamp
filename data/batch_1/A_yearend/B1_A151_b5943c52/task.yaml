instruction: 가상구절초설계의 가상염지안은 자녀 세 명의 대학 및 생활 지출 자료를 제출했습니다. 자녀마다 나이와 소득 조건이 달라 가족
  수와 자녀세액공제액을 먼저 구해 주세요. 장학금을 뺀 자녀 학비와 본인 대학원 학비를 합산한 교육비 세액공제액을 계산합니다. 가족 카드 및 보험과
  직원 부담 진료의 기준을 각각 적용한 카드 소득공제와 보험료 및 의료비 세액공제액도 구합니다. 산출세액과 결정 소득세를 적어 최종 마감합니다.
