instruction: 가상해송자동화의 가상시유준 정산을 마감합니다. 주택대출의 실제 상환 조건과 카드 종류별 사용액으로 주택자금 및 카드 소득공제액을
  구하고 소득공제 종합한도 초과액을 계산해 주세요. 보유 주택과 별도 월세 신청을 대조해 월세 세액공제액도 적습니다. 장애인 성년 자녀와 다른 형제에게
  배정한 어머니 자료를 확인해 기본공제액 및 보험료와 기부금 세액공제액을 구합니다. 연금계좌 세액공제와 최종 과세표준 및 결정 소득세도 필요합니다.
