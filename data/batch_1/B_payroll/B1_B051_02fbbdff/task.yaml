instruction: 가상바다결설계의 가상문도윤 급여에는 취소된 6월 30일 계획과 실제 7월 1일 실행 기록이 있습니다. 승인 가족은 본인 포함
  13명이고 그중 네 명은 기본공제 대상인 9세, 12세, 17세와 19세 자녀입니다. 지급 상태와 별도 보험 통지를 대조하여 통지된 부과월의 연금
  기준소득월액과 부담액을 구해 주세요. 11명 초과 가족 수 규칙과 자녀 공제를 사용한 소득세 및 지방소득세, 공제 합계와 실지급액도 작성해 주세요.
  실행 상태로 확정한 실제 지급일을 effective_payment_date에 YYYY-MM-DD로 작성해 주세요. 국민연금 상하한은 은행 지급일
  대신 공단 통지의 보험 부과월을 기준으로 적용합니다.
