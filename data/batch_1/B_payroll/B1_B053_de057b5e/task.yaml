instruction: 가상풀잎영상실의 가상도하경은 주 30시간 시급제 직원입니다. 소정 일정과 무급 결근 및 주별 출근을 보고 기본급과 주휴수당을
  구해 주세요. 삼일절과 대체공휴일의 분 단위 승인 기록에서 휴게와 야간을 반영해 휴일수당과 야간 가산수당을 계산해 주세요. 승인된 120% 원천징수
  비율을 적용한 소득세와 총지급액 및 실지급액을 작성해 주세요. 각 수당 월 합계에서 원 미만 올림합니다. 대체공휴일에 별도로 지급할 기본 유급휴일
  임금은 paid_holiday_pay에 작성하고 총지급액에 합산해 주세요.
