instruction: 가상촘촘계측제작실의6월 근로분에 지급 계획과 은행 처리 이력이 함께 남아 있습니다. 현충일 오전과 저녁의 서로 다른 승인 작업을
  하루 합계로 계산하고 별도 평일 추가 기록과 야간 가산을 구해 주세요. 지급 기록의 상태로 적용일을 정한 뒤 회사 음식물 제공과120% 신청 및
  세 자녀, 공단 통지의 6월 부과분 국민연금 상한을 반영하여 과세급여와 원천세 및 실지급액을 작성합니다. 실행 상태로 확정한 실제 지급일을 effective_payment_date에
  YYYY-MM-DD로 작성해 주세요. 국민연금 상하한은 은행 지급일 대신 공단 통지의 보험 부과월을 기준으로 적용합니다.
