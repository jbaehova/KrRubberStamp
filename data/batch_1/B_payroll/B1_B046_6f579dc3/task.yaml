instruction: 가상루비계측의 가상류온서 급여는 식대 비과세를 제외하면 과세급여가 정확히 1000만원입니다. 승인 가족은 본인을 포함한 12명이며
  별도 연령 대상 자녀 공제는 없습니다. 원문 표의 1000만원 행과 11명 초과 가족 계산 규칙을 확인하고 120% 신청을 반영한 소득세 및 지방소득세를
  구해 주세요. 과세급여, 국민연금과 총 공제액 및 실지급액도 작성해 주세요.
