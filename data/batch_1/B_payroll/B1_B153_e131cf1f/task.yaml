instruction: 가상한낮배움터의 시급 마감은 결근 주와 한 휴일의 두 작업을 함께 다룹니다. 소정 일정에서 결근을 반영한 기본급과 실제 개근
  주휴를 구해 주세요. 수정 승인 카드와 같은 휴일의 야간 카드를 하루로 묶어 휴일수당 및 야간 가산을 계산합니다. 은행 실행일과 별도 보험 부과월을
  각각 확인하고 신청된 80퍼센트 세액 및 최종 실지급액까지 작성합니다. 실행 상태로 확정한 실제 지급일을 effective_payment_date에
  YYYY-MM-DD로 작성해 주세요. 국민연금 상하한은 은행 지급일 대신 공단 통지의 보험 부과월을 기준으로 적용합니다.
