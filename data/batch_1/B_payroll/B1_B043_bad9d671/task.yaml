instruction: 가상진주전시실의 가상채가람은 주 25시간 시급제입니다. 한 주의 무급 결근과 나머지 주 출근을 확인해 기본급 및 추가 주휴수당을
  구해 주세요. 광복절과 대체공휴일의 서로 다른 승인 근로 기록은 일별 8시간 기준으로 나누고 야간 부분도 반영하여 휴일수당과 야간수당을 계산해
  주세요. 총지급액과 실지급액까지 작성해 주세요. 대체공휴일에 별도로 지급할 기본 유급휴일 임금은 paid_holiday_pay에 작성하고 총지급액에
  합산해 주세요.
