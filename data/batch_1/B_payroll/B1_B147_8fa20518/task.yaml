instruction: 가상해오름측정실은 당월 실적금 지급과 평일 추가 카드 수정을 함께 승인했습니다. 정기 임금과 실적금을 구분하여 월 통상임금을
  구하고, 승인 상태와 번호로 추가 근로를 확정해 연장수당을 계산해 주세요. 최종 과세급여가 고액 산식의 어느 구간인지 판단한 뒤 소득세와 지방소득세
  및 실지급액을 마감합니다. 현장 제출 스캔 사본은 같은 수정 승인 식별자이므로 별도 작업으로 더하지 않습니다.
