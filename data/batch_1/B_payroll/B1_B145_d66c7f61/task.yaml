instruction: 가상밤결제본실은 상시 네 명 사업장이고 시급 직원에게 소정 야간 작업과 별도 휴일 작업이 있습니다. 승인 카드와 출근 확인을
  보고 기본급 및 주휴수당을 구하고, 휴일 실제 근로 대가와 야간 가산액을 적용 범위에 따라 계산해 주세요. 은행 기록과 별도 보험 부과 통지를
  읽고 부과월에 맞는 낮은 연금 신고액의 하한을 적용합니다. 최종 실지급액까지 필요합니다.
