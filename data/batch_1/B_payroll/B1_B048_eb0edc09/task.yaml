instruction: 가상연못실험실에 10월 19일 입사한 가상민해준의 첫 시급 급여입니다. 소정 일정에서 무급 결근을 빼 기본급을 구하고 주별
  예정일과 출근일로 주휴수당을 판단해 주세요. 평일 추가 근로 승인 시각의 휴게와 야간을 반영한 연장수당 및 야간수당도 필요합니다. 공단 확인의
  첫 달 부과 상태를 사용하여 국민연금과 건강보험 및 고용보험 공제액과 실지급액을 작성해 주세요.
