instruction: 가상둥근홈공방은 6월 말 지급 계획과 7월 은행 실행 기록, 이후 다시 작성한 계획을 함께 보관합니다. 공단의 6월 보험 부과
  통지에 적용할 연금 기준과 연금 부담액을 구하고 회사 배식에 따른 비과세 및 과세급여와 최종 실지급액을 계산해 주세요. 실행 상태로 확정한 실제
  지급일을 effective_payment_date에 YYYY-MM-DD로 작성해 주세요. 국민연금 상하한은 은행 지급일 대신 공단 통지의 보험
  부과월을 기준으로 적용합니다. 전체 공제액도 적어 주세요.
