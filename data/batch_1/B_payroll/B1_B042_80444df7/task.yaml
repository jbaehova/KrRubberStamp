instruction: 가상청람정밀의 가상차다인 급여를 승인하려고 합니다. 광복절 근무 기록에는 최초 승인본과 수정 승인본이 모두 남아 있고 별도
  평일 추가 근로도 있습니다. 기록별 최신 승인본에서 휴게를 제외해 평일 연장수당, 휴일수당과 야간 가산수당을 구해 주세요. 8월 국민연금 신고액에
  적용되는 상한을 반영하여 국민연금 부담액과 총지급액 및 실지급액을 작성해 주세요.
