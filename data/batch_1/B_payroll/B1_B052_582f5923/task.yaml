instruction: 가상노을수리실은 상시 근로자 네 명이고 가상신은재 직원은 만 62세입니다. 법정 유급 주휴일의 실제 근로와 평일 추가 근로의
  원시 기록을 확인하여 연장수당, 휴일수당과 야간 가산을 계산해 주세요. 법정 가산 외 우대 약정은 없습니다. 회사 식사와 현금 식대도 함께 지급하므로
  과세급여를 확인하고 국민연금 및 고용보험 공제액과 실지급액을 작성해 주세요.
