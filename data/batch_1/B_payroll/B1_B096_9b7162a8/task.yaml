instruction: 가상바람색보관실 직원의 월 근로와 주별 출근은 정상 개근입니다. 다만 계약은 주14시간이므로 주휴 칸을 따로 확인해 주세요.
  취소 계획일 대신 실제 지급 기록을 읽어 국민연금의 적용 기준소득월액과 부담액을 계산하고 기본급 및 실지급액을 작성합니다. 실행 상태로 확정한
  실제 지급일을 effective_payment_date에 YYYY-MM-DD로 작성해 주세요. 국민연금 상하한은 은행 지급일 대신 공단 통지의
  보험 부과월을 기준으로 적용합니다.
