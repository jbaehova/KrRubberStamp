      - {execution_id: 이차출금, date: '2026-07-24', status: executed, direction: debit, amount: 100700, bank_fee: 700}
    allocation_instructions:
      - {instruction_id: 정리일차, execution_id: 일차출금, filing_id: F정리, registration_id: R정리, kind: settlement_payment, amount: 80000}
