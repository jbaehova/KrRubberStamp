          business_type: corporation
          consumer_facing_business: false
          prior_year_site_supply_base: 60000000
          receipt_credit_previously_claimed: 0
          prepaid_assessed_vat: 0
          scope_note: 기업 행사 안내물을 납품하고 정상 전체 전자를 발행했다. 다른 거래나 공제는 없다.
          operations: []
          activities: []
          transactions:
            - {transaction_id: 안내납품, document_id: 안내전자, direction: sale, date: '2026-04-09', description: 기업 안내판 전량 인도, amount: 880000, includes_vat: true, taxable: true, evidence: tax_invoice, invoice_issued: true, vat_separately_stated: true, counterparty_consumer: false}
    bank_executions:
