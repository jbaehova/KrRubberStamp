          activities: []
          transactions:
            - {transaction_id: 정리완료, document_id: 정리전표, direction: sale, date: '2026-05-18', description: 가정 방문 정리 완료, amount: 2200000, includes_vat: true, taxable: true, evidence: card_receipt, invoice_issued: false, vat_separately_stated: false, counterparty_consumer: true}
