      - {filing_id: F정리, taxpayer_id: T정리, registration_id: R정리, business_name: 가상정리서비스, tax_due: 171400, payable_vat: 171400, refund_vat: 0, paid: 160000, received: 0, net_outflow: 160000, balance: 11400}
